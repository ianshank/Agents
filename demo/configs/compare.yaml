schema_version: "1.0"

# Multi-model comparison: the real support bot vs. a naive "echo" baseline that
# just parrots the question back. Same dataset, scorers, and judge for both, so
# the ranking is apples-to-apples.
#
# Run:
#   PYTHONPATH=. EVAL_HARNESS_CALLABLE_TARGET_ALLOWLIST=demo \
#     eval-harness compare --config demo/configs/compare.yaml --offline
#
# The allowlist is required because one model below is a `callable` target, which
# imports and calls a module this file names. That makes a config executable input,
# so the operator — not the config — declares which modules are trusted (ADR 0039).
# `demo/run_demo.sh` exports it for you. No `judge_calibration` block is needed
# here: this config declares no `gate`, so no judge participates in gating.

run:
  name: "support-bot-compare"
  seed: 7

dataset:
  type: jsonl
  params:
    path: demo/data/support_bot.jsonl

# Required by the schema; the per-model targets below are what actually run.
target:
  type: echo
  params: { output_key: question }

scorers:
  - type: contains
    params: { name: mentions_settings, substring: "Settings" }
  - type: regex_match
    params: { name: actionable_step, pattern: 'Settings\s*>' }
  - type: weighted
    params:
      name: answer_quality
      strategy: weighted_mean
      pass_threshold: 0.5
      components:
        - { type: contains, params: { substring: "Settings" }, weight: 1.0 }
        - { type: regex_match, params: { pattern: 'Settings\s*>' }, weight: 1.0 }
  - type: llm_judge
    params:
      name: helpfulness
      threshold: 0.6

judge:
  type: mock
  params:
    default_score: 0.9
    rules:
      - { contains: "cancel", score: 0.4 }

comparison:
  models:
    - name: support_bot
      target:
        type: callable
        params: { path: "demo.support_bot_target:answer" }
    - name: echo_baseline
      target:
        type: echo
        params: { output_key: question }
  baseline: echo_baseline
  rank_by: answer_quality
  rank_metric: mean
