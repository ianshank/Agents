    implemented_in: "ab644fb26338163e14098e3aa4e13a7ffecd2349"
    depends_on: ["F-007"]
    notes: "Found by a 22-agent documentation-deduction pass and confirmed by independent measurement. Complements F-007 (the guard itself): F-007 decides WHAT is protected, F-052 asserts the CI can SEE it. The push-trigger filter is deliberately left narrower -- the label gate operates on pull_request, which is what this checks."

  - id: "F-053"
    epic: "Quality Gate"
    name: "Matrix completeness: derived component census, per-kind dim floors, generated coverage artifact"
    description: "The declared test matrix (tests/test_matrix_eval_tools.py, 'All eval tools x standardized metrics') was silently incomplete: the seven F-051 trajectory scorers had zero rows, TestM7Registry's hand-maintained name/alias lists were stale the day they registered, 13 of 23 registered aliases were asserted nowhere, and nothing failed when a component registered rowless -- the same manual-list-vs-derived-reality defect class F-050 and F-052 closed elsewhere. Now the component census is derived from the live registries in a fresh subprocess (registries discovered dynamically by .kind, so the queued STATE_ADAPTERS registry will be censused automatically and fail with an actionable message until it has rows and a policy entry); matrix classes carry literal MATRIX_KIND/MATRIX_COMPONENTS checked declarations cross-checked against the census in both directions; per-kind dimension floors (ADR 0032) with a two-way-hygienic waiver map are enforced by tests/test_matrix_coverage.py; the alias->canonical pairing per kind is frozen by exact equality (Registry._aliases assignment has no duplicate guard, so a repointed alias still resolves); M8 pipelines live in an importable PIPELINES index whose component kinds are read from validated EvalConfig fields (never bare 'type' literals -- braintrust/langfuse exist in two registries); and docs/matrix-coverage.md is generated and freshness-gated. Landing this surfaced and fixed three shipped defects: config/trajectory_eval.yaml failed its own gate (reference arguments never matched the demo SUT while the covering test asserted only non-emptiness), the braintrust dataset/sink matrix cells sat under importorskip for an SDK CI never installs and could not have passed as written, and quality-gates.yml carried a dead --cov=F_052."
    category: "validation"
    priority: "high"
    status: "done"
    tier: "fast"
    verification:
      - "every registered component meets its kind's REQUIRED_DIMS floor, both directions -- a registered component with no matrix rows fails, and a matrix class declaring an unregistered component fails; mutation: removing one scorer's M1 class from the cell map reports 'missing required dim(s) [M1]' (tests/test_matrix_coverage.py; evaluated directly by F_053.py check 3 via mc.coverage_problems -- never inferred from the generated document, which would PASS a holed matrix whose doc records the holes)"
      - "a sixth registry kind is censused automatically and fails with an actionable message naming the policy dict, ADR 0032, waivers and --update; asserted against a synthetic state_adapter census (tests/test_matrix_coverage.py::test_guard_fails_an_unknown_census_kind_with_an_actionable_message)"
      - "the alias->canonical pairing per kind equals FROZEN_ALIAS_MAP by exact equality, so a silently repointed alias is a CI failure rather than a doc diff (tests/test_matrix_coverage.py::test_alias_pairings_match_the_frozen_map_exactly)"
      - "docs/matrix-coverage.md matches an in-memory regeneration; mutation: a hand edit to the committed doc exits 1 from --check and fails the freshness test (F_053.py check 2; tests/test_matrix_coverage.py::test_matrix_doc_is_fresh)"
      - "no designated registry class parametrizes over constant literals of any nesting -- the hardcoded-list defect cannot creep back (F_053.py check 4, via the imported detector; tests/test_matrix_coverage.py::test_no_literal_parametrize_in_designated_registry_classes)"
      - "every claimed cell actually executes in CI: importorskip gates inside matrix classes are coupled to eval-harness-ci.yml's install line in both directions -- a gate CI does not satisfy, an undeclared gate, and a stale declaration each fail (mc.skip_gate_problems, asserted by tests/test_matrix_coverage.py::test_every_skip_gated_cell_actually_executes_in_ci plus its three mutation tests, and re-checked by F_053.py check 3; closes the parquet false-green class where skipped cells read as covered)"
      - "the generated doc is reachable in CI: eval-harness-ci.yml lists docs/matrix-coverage.md on both push and pull_request paths, so a doc-only hand edit runs the suite and the freshness gate (F_053.py check 5)"
      - "waivers and follow-on obligation rows cannot go stale in either direction (tests/test_matrix_coverage.py::test_guard_fails_waivers_in_both_directions, ::test_guard_fails_a_satisfied_follow_on_row)"
    validation_command: "python scripts/validations/F_053.py"
    implemented_in: "bc0ae2c4940f0ecdfa50da47f1c249cb16b77e02"
    depends_on: ["F-039", "F-051", "F-052"]
    notes: "Policy and mechanism recorded in ADR 0032. The guard library (tests/_matrix_coverage.py) single-sources REQUIRED_DIMS/EXTRA_SUITES/WAIVED/FROZEN_ALIAS_MAP/FOLLOW_ON; F_053.py imports them rather than restating (the F-052 no-restatement principle). The census is subprocess-fresh because two test modules register doubles into the process-global registries; the derived M7 in-process read is safe only in the baseline-resolves direction (canonical registrations are add-only; alias assignment is not, which is exactly why the freeze exists)."

  - id: "F-054"
    epic: "Quality Gate"
    name: "Quality-gate coverage-threshold hardening: no live env evasion, anchored exclude regex"
    description: "skills/quality-gate/scripts/gategen/render.py generated a quality-gate.sh whose coverage gate could be made to report green without meeting its real threshold, four independent ways: COV_FAIL_UNDER was a live, unguarded environment override (COV_FAIL_UNDER=0 made every package's coverage gate trivially pass -- zero unset statements existed anywhere in the generated script); COVERAGE_SOURCE had the identical problem in the single-source case specifically (the majority code path, since every one of the 7 served packages uses single-source coverage) even though the multi-source branch already guarded it; PYTEST_ADDOPTS passed through to pytest completely unguarded, so any coverage-weakening flag (--no-cov, -k, --override-ini) set in the environment silently applied; and agent-core/behavioral-regression/flow-protocol/flow-corpus's pyproject.toml all carried an UNANCHORED exclude_also regex (\"\\.\\.\\.\") that coverage.py matches with re.search, not a full-line match -- silently excluding any line containing three consecutive dots, not just a standalone Protocol/abstract-method stub body, contradicting docs/decisions/0009-tech-debt-audit-and-compat-surface.md's own claim (S4) that the pattern was aligned with root's already-anchored one. No positive-control test existed anywhere that planted a deliberately low-coverage module and asserted the real generated gate actually fails -- test_gen_gate.py's fixtures hardcoded fail_under=0, so nothing could demonstrate the threshold did anything. Closed by making --cov-fail-under=/--cov= generation-time literals in both coverage_command() branches (never a live $COV_FAIL_UNDER/$COVERAGE_SOURCE reference), unconditionally warning to stderr when either env var is set anyway, adding a warn-then-unset PYTEST_ADDOPTS guard ahead of every pytest invocation the gate makes (do_test, do_coverage, and root's hand-maintained do_extra() below the marker seam), anchoring the four packages' regex to \"^\\s*\\.\\.\\.$\" (verified safe by re-running each package's full coverage suite for real, not assumed), and adding subprocess-level positive-control tests that shell out to the real rendered script and real pytest/coverage. tests/_e2e_matrix.py's _floor_from_gate_script, which cross-checks a pyproject.toml floor against its generated gate script for every package, was also updated -- its old regex matched only the pre-hardening variable-declaration form and would have silently degraded that cross-check to a single remaining anchor once the generator stopped emitting it."
    category: "validation"
    priority: "high"
    status: "done"
    tier: "fast"
    verification:
      - "all 7 regenerated quality-gate.sh copies warn to stderr when COVERAGE_SOURCE, COV_FAIL_UNDER, or PYTEST_ADDOPTS is set at runtime, and none interpolates a raw \"$COV_FAIL_UNDER\" into --cov-fail-under= or a raw single-source \"$COVERAGE_SOURCE\" into --cov= (F_054.py; mutation: reverting render.py's _coverage_command to the pre-fix form reintroduces both raw-interpolation strings and F_054.py fails)"
