      - "F_050.py itself is coverage-measured, not merely smoke-tested by validate.py --tier fast: it is imported and exercised by tests/test_validation_scripts.py and counted in quality-gates.yml's --cov= list, so it is part of the offline suite eval-harness-ci.yml runs on .github/-only edits (the class of edit PR #64 showed can break CI wiring silently)"
