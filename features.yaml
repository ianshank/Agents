    epic: "Quality Gate"
    name: "Merge-gate calibrator-health integrity: operating-region CI, bounded policy, single-sourced binning"
    description: "Closes a reproducible fail-open in the calibrated merge gate's fourth health floor. _upper_half_ci_width scanned only bins above raw confidence 0.5 and accumulated into a 0.0 initialiser, so a domain whose audits all sat below that left every scanned bin empty and the max-reduction returned its identity element, satisfying max_bin_ci_width vacuously: 6600 HUMAN_AUDIT records at raw {0.05, 0.45} produced bin_ci_width=0.0, is_trustworthy=True, tau=1.0 and AUTO_MERGE at raw_confidence=0.45 under stock GatePolicyConfig(). The scan was also on the wrong axis -- decide() gates on the calibrated p against tau, not the raw score -- and tau cannot define the region because tau is derived FROM health. _operating_bin_ci_width instead defines eligibility by the per-decision Wilson floor (a bin whose Wilson UPPER bound cannot reach wilson_floor can never be an operating point whatever tau becomes), returns None when nothing qualifies, and is_trustworthy rejects None. GatePolicyConfig gains a __post_init__ bounding all nine tunables plus CLI flags on merge_gate_ci with an exit-2 usage path, satisfying ADR 0005's standing promise of a human-set risk_target; min_auroc is bounded strictly above 0.5 so the single-class AUROC sentinel cannot pass the floor it is documented to fail. The bin count is single-sourced (calibration.DEFAULT_N_BINS + GatePolicyConfig.n_bins, threaded explicitly), score-to-bin routing is unified in _bin_of, and min_calibration_n now floors the held-out fold the other metrics are measured on. Decision-neutral on the live store (71 records, 0 HUMAN_AUDIT => every domain cold-starts to ESCALATE); no SCHEMA_VERSION bump, no store migration, auto-merge stays default-off. Peer review of this change found the fix itself had regressed fit/_operating_bin_ci_width from O(n_bins*n) to O(n_bins^2*n) by routing per-bin membership through _bin_of's own O(n_bins) scan; a shared _bucket_by_bin helper (one assignment per score, then group) restores the original complexity and n_bins gains an upper bound (MAX_N_BINS=1000, a resource-safety ceiling) now that it is CLI-reachable."
    category: "non-functional"
    priority: "high"
    status: "done"
    tier: "fast"
    verification:
      - "the bin-CI health floor cannot pass unmeasured: _operating_bin_ci_width returns None when no bin's Wilson upper bound reaches wilson_floor, and CalibratorHealth.is_trustworthy rejects None before comparing against max_bin_ci_width (F_049.py, agent-core/tests/test_outcome_store.py, agent-core/tests/test_merge_gate.py)"
      - "eligibility is tau-free and computed on the decision axis: the region is defined by cfg.wilson_floor rather than by the raw-score range, so a domain whose audits all sit below 0.5 is measured rather than invisible; the old 0.0-initialiser assertion that pinned the defect as correct is deleted (F_049.py, agent-core/tests/test_outcome_store.py)"
      - "every GatePolicyConfig tunable is bounded, rejecting the vacuous endpoint and accepting the maximally-strict one, with non-finite values rejected explicitly because NaN compares False against every bound; min_auroc > 0.5 so the single-class sentinel cannot satisfy the discrimination floor (F_049.py, agent-core/tests/test_merge_gate.py)"
      - "the policy is operator-reachable and fails as a usage error: merge_gate_ci exposes a flag per tunable and returns exit 2 -- never 1 (internal) and never 0 (proceed to merge) -- because the construction sits before the outer exception handler; --protected-auto-merge is deliberately absent and its in-process use is logged (F_049.py, agent-core/tests/test_merge_gate_ci.py)"
      - "the bin count has one home and is passed, not defaulted, at every call site: calibration.DEFAULT_N_BINS backs GatePolicyConfig.n_bins, build_domain_models threads it into fit/expected_calibration_error/_operating_bin_ci_width, and n_bins >= 2 because one bin makes predict() constant and every change clear tau (F_049.py, agent-core/tests/test_merge_gate.py)"
      - "score-to-bin routing is single-sourced in _bin_of: fit and bin_index agree on out-of-contract scores (floored to bin 0, fail-closed, never raising per ADR 0025) where fit previously swept >1.0 into the top bin, while the metrics layer still raises; the edge-comparison scan is retained because min(int(raw*bins), bins-1) re-bins exact decimal boundaries (agent-core/tests/test_outcome_store.py)"
      - "min_calibration_n floors the held-out fold the accompanying ECE/AUROC/width were measured on, not the both-fold total that overstated it 2x; n_total is retained as a non-gating diagnostic (F_049.py, agent-core/tests/test_outcome_store.py)"
      - "the held-out contract is mutation-resistant: with a separable fit fold and an anti-correlated eval fold, swapping eval_recs for fit_recs, fit_recs for eval_recs, or n for len(recs) each turns the suite red -- verified by applying every mutation, the pre-existing healthy-domain test surviving eval->fit is what proved it toothless (agent-core/tests/test_outcome_store.py)"
      - "outcome_labeller's precedence is pinned with both signals live, so REVERT winning over CI_FAILURE can no longer be reordered green; verified by swapping the branches (agent-core/tests/test_outcome_labeller.py)"
      - "n_bins scoring is O(n_bins * n), not O(n_bins^2 * n): fit and _operating_bin_ci_width assign each score to a bin ONCE via the shared _bucket_by_bin helper and group, rather than re-scanning every score once per bin through _bin_of's own O(n_bins) linear scan -- peer review measured the naive form at ~3.8s for n_bins=200 on 5000 scores once the bin count became CLI-reachable; verified bit-for-bit identical to the pre-fix output across every n_bins tested (F_049.py, agent-core/tests/test_outcome_store.py)"
      - "n_bins is bounded above (MAX_N_BINS=1000) as a resource-safety guard distinct from the class's vacuous-endpoint rule -- it is now an operator-supplied CLI value with real per-domain CI cost, not merely a correctness knob (F_049.py, agent-core/tests/test_merge_gate.py)"
      - "the CLI flag-to-field mapping is unit-tested directly, not only through decision-level assertions: nine distinct values through every merge_gate_ci flag land on their own GatePolicyConfig field, closing a gap where a wilson_floor/wilson_z swap would have passed every prior test (both fields reject the same invalid probe values for different reasons) (agent-core/tests/test_merge_gate_ci.py)"
      - "the fold-collapse fallback (all of a domain's records hashing to one SHA256 fold) is proven safe at N=8, not only the N=1 case where min_calibration_n masks the effect regardless of the fallback (agent-core/tests/test_outcome_store.py)"
      - "agent-core stays at its 95 coverage floor with merge_gate, merge_gate_ci and outcome_store at 100% branch; ruff, ruff format and strict mypy clean; every touched file under the 500-line budget"
    validation_command: "python scripts/validations/F_049.py"
    implemented_in: "8f7affd6c0af2a2eb47374632effc49ee161d835"
    depends_on: ["F-010", "F-032"]
    notes: "Peer review, design and task breakdown in openspec/changes/archive/merge-gate-health-integrity/; decision recorded in ADR 0029, with a correction section added to ADR 0005 whose points 3 and 5 this repairs. Re-verification of docs/gap-analysis-merge-gate-2026-07-24.md found its G1/G2/G3 confirmed but G3's stated mechanism wrong (wilson_interval(0,0) is unreachable behind an empty-bin continue; the fail-open is the max-reduction identity) and its G5 substantially refuted (both modules gained logging since). Three defects the gap analysis never named are closed here: the wrong measurement axis, the both-fold sample count, and the missing min_auroc lower guard. Deferred to a follow-on: wiring the workflow to the new flags (decision-changing the moment a repo variable is set) and the risk-appetite decision on max_bin_ci_width, which under honest measurement may keep the gate closed until every eligible bin holds ~50+ high-accuracy audits."

