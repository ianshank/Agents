      - "a MODIFIED test still carries the protected penalty and scores exactly as before (0.550 unchanged): withholding all tests would make 'modify only an eval-defining test' the highest-confidence class in the system at 0.900, the Goodhart failure scripts/fix_loop.py names (scripts/validations/F_061.py, tests/test_agent_confidence.py::test_modifying_an_existing_test_still_carries_the_protected_penalty)"
