  - id: "F-059"
    epic: "Eval Harness"
    name: "PanelJudge: aggregate N member judges, abstain rather than guess"
    description: "A single LLM judge is a single point of systematic failure -- order bias, verbosity preference, self-preference (extend-judge-calibration/F-057's own three probe targets). Adds PanelJudge (src/eval_harness/judges/panel.py, registered 'panel'), which builds N member judges once at construction via the same JUDGES registry the engine uses, evaluates them sequentially in declaration order (required for determinism -- a thread-pooled fan-out would satisfy every other requirement and fail this one intermittently), and aggregates under an explicit strategy: median (default), mean, or majority (a pass fraction at member_pass_threshold, not a score in the members' own space). A member whose call raises is excluded from aggregation, never recorded as a fabricated 0.0 vote. The panel abstains -- raw['abstained']=True, a configurable on_skip score -- when fewer than quorum members survive (default a simple majority) or when the surviving spread exceeds an optional disagreement_threshold, mirroring the house convention that an uncertain verdict is surfaced, not guessed (Decision.CANT_TELL, cant_tell, OracleResult.verdict=None). LLMJudgeScorer.score reads verdict.raw.get('abstained') duck-typed and reports ScoreResult.passed=None for an abstained verdict, mirroring AutoevalsScorer's existing skip contract -- no PanelJudge-specific code in the scorer. Fixes a real budget/rate-limit bug found during design: BudgetedJudge reserved cost and a rate-limit slot exactly once per evaluate() call, silently under-charging an N-member panel by factor N. PanelJudge.calls_per_evaluate (public, duck-typed, recursive -- a nested panel-of-panels reports its true call count) is read by BudgetedJudge/build_budgeted_judge to scale both the cost reservation and the rate-limiter's slot consumption; _SlidingWindowLimiter gained atomic try_acquire_n/acquire_blocking_n (replacing the old single-slot methods, since there is no 'release' to unwind a partial N-slot reservation), and build_budgeted_judge fails fast at construction when calls_per_evaluate exceeds max_per_window rather than deadlocking on the first blocked call. agent_core.JudgeCalibrationReport gains three trailing, defaulted, panel-only fields (pairwise_member_kappa, abstention_rate, member_families) -- informational only, never read by may_gate/failing_checks, proven by a test holding every gating-relevant value identical between a mock-shaped and a panel-shaped report and asserting byte-identical require_report_to_gate outcomes. pairwise_member_kappa() (src/eval_harness/agent_core_adapter/calibration.py, split from __init__.py to stay under the file-size budget) computes Cohen's kappa between every pair of members' binarized pass/fail decisions across a corpus, reusing agent_core.golden.cohen_kappa rather than re-deriving it."
    category: "functional"
    priority: "medium"
    status: "done"
    tier: "fast"
    verification:
      - "PanelJudge rejects an empty member list, a single-member list, an unknown strategy, and a quorum outside [1, len(members)] (F_059.py)"
      - "An unknown member type propagates RegistryError from the registry's own create() -- PanelJudge does not duplicate that check (F_059.py)"
      - "median/mean/majority strategies produce correct values on hand-crafted examples; majority reports a pass fraction, not a member score (F_059.py)"
      - "A failed member is excluded from aggregation and named in raw['failed_members'], never counted as a fabricated 0.0 vote (F_059.py)"
      - "The panel abstains (raw['abstained']=True, score=on_skip) below quorum, and independently when the surviving spread exceeds disagreement_threshold (F_059.py)"
      - "calls_per_evaluate sums each member's own calls_per_evaluate (default 1), recursively -- a nested panel reports its true call count, not its member count (F_059.py)"
      - "BudgetedJudge/build_budgeted_judge scale both the cost reservation and the rate-limiter's slot consumption by calls_per_evaluate; build_budgeted_judge raises at construction when calls_per_evaluate exceeds max_per_window (F_059.py)"
      - "LLMJudgeScorer.score reports passed=None (not a false pass/fail) when the injected judge's verdict carries raw['abstained']=True, duck-typed -- no import of or special-case for PanelJudge (F_059.py)"
      - "pairwise_member_kappa computes Cohen's kappa correctly between member pairs (perfect agreement -> 1.0) and rejects fewer than two members (F_059.py)"
      - "JudgeCalibrationReport's three panel-only fields default empty/None, thread through build_judge_calibration_report, and never affect may_gate/failing_checks (F_059.py)"
      - "tests/test_matrix_panel_judge.py covers the judge floor (M1/M2/M3/M6) plus M5 voluntarily -- the floor's 'verdict determinism is the provider's' exclusion does not hold for panel's own repo-owned aggregation/quorum/abstention logic"
      - "panel is registered under both READMEs' judges/ listings, verified directly against scripts/extract_registries.py --check (the registry-drift guard)"
    validation_command: "python scripts/validations/F_059.py"
    implemented_in: "955bc9c919ba69fb71f3cd4a9f1a7c0092cbe151"
    depends_on: ["F-057"]
    notes: "OpenSpec package: openspec/changes/add-panel-judge/ (proposal.md, design.md, tasks.md, review.md; design/review already resolved in PR #142). Depends on F-057 (extend-judge-calibration) for the calibration-artifact gating rule panel members inherit unchanged -- no panel-specific gating code exists. Landed as 7 independently-committed, independently-verified groups on the same branch (panel + abstention; budget/rate accounting; matrix/registry currency; calibration fields; ADR 0035; this governance entry; final verification), each pushed before starting the next, after a session-continuity break mid-implementation lost an earlier, uncommitted attempt at the same 4 groups -- a concrete instance of why. No architecture.yaml edge: panel is a registered Judge reached through the already-declared eval_harness.judges component, and calibration.py sits inside the already-declared agent_core_adapter: [agent_core, config, core] edge."

  - id: "F-060"
    epic: "Eval Harness"
    name: "Stateful outcome evaluation: StateAdapter seam, engine lifecycle, local adapters"
    description: "Every built-in scorer reads output.output -- the agent's own account of what it did. An agent that replies 'the booking was completed' while creating no booking scores identically to one that actually created it. Adds a sixth structural seam, StateAdapter (src/eval_harness/core/interfaces.py: snapshot/evaluate/reset, runtime_checkable Protocol typed against RunContext, not the nonexistent EvalContext), a STATE_ADAPTERS registry (src/eval_harness/plugins.py), and two new core value objects (StateSnapshot: opaque, frozen, adapter-owned data; StateEvaluation: goal_reached and policy_violated as two independent axes, not one collapsed bool, so an attempt can reach its goal via a forbidden mutation without either signal masking the other). The engine, not the target, owns the lifecycle -- TargetRunner.run(item) takes no context parameter, so there is nowhere on the target to hang before/after capture. EvalEngine._run_one brackets a configured attempt reset -> snapshot(before) -> target.run(item) -> snapshot(after) -> evaluate (core/_state_lifecycle.py, split out of engine.py to stay under the size budget) under a lock spanning the whole span, target.run() included (Decision C: a shared adapter instance is not safe under max_workers>1 without one -- the accepted cost is that a configured state_adapter serializes target.run() itself under parallelism, documented in ADR 0031's Consequences, not silently adopted). Two divergent failure paths (Decision B, neither of _run_one's two existing idioms fit): StateResetError propagates uncaught and aborts the run unconditionally, never fail_fast-gated (_run_one_safe re-raises rather than swallows it; _run_parallel's collection loop catches it at the future.result() call site, shuts the pool down, and re-raises) -- continuing would score subsequent attempts against contaminated state. A snapshot/evaluate failure is wrapped in StateSnapshotError, logged, and converted to a synthetic failing 'state_lifecycle' ScoreResult -- the item always gets a normal, visibly-failed result, never silently dropped the way an uncaught target error already can under parallel execution with fail_fast=False (a pre-existing, unrelated quirk, deliberately left alone). Two new scorers (src/eval_harness/scorers/state.py) read ctx.extra['state_evaluation']: state_transition reports goal_reached; policy_violation fails independently of goal success, abstaining (passed=None) when no evaluation is present. Four local, deterministic, offline adapters (src/eval_harness/state_adapters/): in_memory (mutable dict, set()/update() as its mutation surface), filesystem (sandboxed temp directory, content-hashed snapshots so size never inflates a snapshot), sqlite (a genuine transaction rollback -- SAVEPOINT taken after schema_sql/seed_sql run once, reset() issues ROLLBACK TO SAVEPOINT then re-establishes it, sanity-checked directly against sqlite3's semantics before committing to the design over a simpler DELETE-and-reseed approach that would not have handled autoincrement sequences the same way), mock_http (in-process request/resource simulation, no network; tracks per-endpoint call counts alongside resource content, so an item can assert 'endpoint X was called N times', not just resource state). All four share one evaluate() implementation (state_adapters/_common.py's evaluate_key_value_state, with an expected_transform hook for adapters whose snapshot stores a derived value like a hash) reading two item.metadata conventions (state_expectation, state_forbidden_keys) mirroring TrajectoryStepEfficiencyScorer's step_budget precedent -- no new EvalItem field."
    category: "functional"
    priority: "medium"
    status: "done"
    tier: "fast"
    verification:
      - "StateSnapshot/StateEvaluation are frozen with read-only mapping fields; StateAdapter is runtime_checkable and a duck-typed fake satisfies it by shape alone; STATE_ADAPTERS registers all four local adapters (F_060.py)"
      - "The engine brackets a configured attempt reset -> snapshot(before) -> target.run -> snapshot(after) -> evaluate, in that order (F_060.py)"
      - "StateResetError aborts the run uncaught, regardless of fail_fast, in both sequential and parallel dispatch (F_060.py, tests/test_state_lifecycle.py)"
      - "A snapshot/evaluate failure produces a visible failing item (a synthetic state_lifecycle score), never a silently dropped one, and gates judge-backed scorers the same way any other programmatic failure does (F_060.py, tests/test_state_lifecycle.py)"
      - "Reset fires before every attempt under repetitions>1, in both the sequential and parallel dispatch paths (F_060.py, tests/test_state_lifecycle.py)"
      - "The engine-level lock genuinely serializes target.run() under a configured state_adapter and max_workers>1 -- a dedicated concurrency test with a control proving real parallelism when no adapter is configured (tests/test_state_lifecycle.py::TestConcurrencyLock)"
      - "state_transition/policy_violation read ctx.extra['state_evaluation']; a goal reached via a forbidden mutation reports state_transition.passed=True and policy_violation.passed=False simultaneously -- neither axis masks the other (F_060.py, tests/test_matrix_state_scorers.py)"
      - "Each of the four local adapters round-trips construct -> mutate -> snapshot -> evaluate -> reset correctly, including the goal-reached-via-forbidden-mutation scenario (F_060.py, tests/test_matrix_state_adapters.py)"
      - "architecture.yaml's import graph matches with zero undocumented dependency after the state_adapters component and its two edges (plugins -> state_adapters, state_adapters -> [core, plugins]) were added, verified directly against the real drift-guard tool, not a restated check (F_060.py)"
      - "cli.py's list-plugins reports the state_adapters registry -- was a hardcoded 5-registry tuple that would have silently omitted a sixth (F_060.py, tests/test_backwards_compat_cli.py)"
      - "the add-stateful-outcome-evaluation FOLLOW_ON obligation (tests/_matrix_coverage.py) has been removed now that STATE_ADAPTERS, all four adapters, both scorers, and both READMEs' listings all exist -- the condition it was recorded to track (F_060.py)"
    validation_command: "python scripts/validations/F_060.py"
    implemented_in: "b709ae1903befd6e6f6f8c6ae59a960b155bf235"
    depends_on: ["F-056"]
    notes: "OpenSpec package: openspec/changes/add-stateful-outcome-evaluation/ (proposal.md, design.md, tasks.md; authorised by ADR 0031). Depends on F-056 (add-repeat-reliability-metrics) for its per-attempt isolation, so state does not leak across repetitions>1 -- no new dependency beyond what F-056 already established. Landed as 8 independently-committed, independently-verified groups on the same branch (engine.py size-budget extraction; contracts + registry + in_memory, pulled forward from the originally-planned adapters group because four independent pre-existing matrix-coverage guards all assumed a registered kind has >=1 real, M8-pipeline-exercised component -- ADR 0032's own Consequences section named this exact scenario; engine lifecycle wiring; the two scorers; filesystem + a shared evaluate() helper; sqlite; mock_http; this governance entry), each pushed before starting the next. architecture.yaml edge flagged for explicit human review per the delivery plan (Phase 0 Sec5), not just CI green -- confirmed airgap-safe: state_adapters depends on core and plugins only, never flow_corpus or agent_core."
  - id: "F-061"
