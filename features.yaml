      - "an added non-test protected path does NOT dodge the penalty -- only tests are withheld (scripts/validations/F_061.py, tests/test_agent_confidence.py::test_added_non_test_file_does_not_dodge_the_protected_penalty)"
      - "the fix is not inert in production: merge-gate-seed.yml derives the added set with git diff --diff-filter=A into added_files.z and passes --added-from (scripts/validations/F_061.py wiring checks)"
