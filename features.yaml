      withholds a newly ADDED test from the protected-path signal, while a MODIFIED test still
      feeds it. Every tests/** root is eval-protected, so a test file was previously priced
      twice -- +w_tests*test_ratio and -w_protected -- and adding tests lowered merge-risk
      confidence in a repo whose purpose is enforcing test quality.
    category: "functional"
