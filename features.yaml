  - id: "F-050"
    epic: "Skills Framework"
    name: "Skills CI coverage floor: paths glob, all-skills structural/registry/drift job, EXEMPT self-check"
    description: "Closes a reproducible CI gap: skills-ci.yml's paths: filter listed 7 of 8 skills with a dedicated job (dataset-lint was omitted), and no workflow at all triggered on the 3 skills with no dedicated job (hierarchical-recursive-brainstorm, openspec-quality-plan, openspec-peer-review). A PR touching only one of those 4 skills ran no lint, no mypy, no pytest, no validate_skill.py, no marketplace validation, and -- the sharpest edge -- no check_skill_script_drift.py, so editing a vendored skills/*/scripts/validate_skill.py copy (the exact drift that guard exists to catch) triggered nothing. The paths: filter is replaced with a single skills/** glob (paths: is workflow-scoped with no per-job if:, so the 7-entry list bought no selectivity, only omission risk). A new all-skills job gives every skills/*/ directory -- discovered dynamically, never an allowlist -- a structural validate_skill.py floor plus repo-level marketplace-registry and drift-guard checks that previously only ran when a PR also happened to touch scripts/**. A second inline step asserts every skill directory is registered in marketplace.yaml and either has a dedicated job or is in an EXEMPT mapping naming the three skills that are docs/SKILL_TEMPLATE.md Sec.5's existing 'Subjective skills' class (ADR 0030 codifies, at the CI layer, a classification those skills already self-declare in their own SKILL.md Sec.5). Each EXEMPT entry is re-checked against evals/evals.json so a skill that later grows real evals and library code fails loudly instead of staying silently exempted -- the same 'manual list drifts from reality' failure this feature closes, recreated one level up, self-guarded. No skill's existing lint/type/coverage job changes; no SCHEMA_VERSION or registry-alias change."
    category: "infrastructure"
    priority: "medium"
    status: "done"
    tier: "fast"
