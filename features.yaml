  - id: "F-056"
    epic: "Eval Harness"
    name: "Repeated-attempt reliability metrics (pass@k / pass^k)"
    description: "EvalEngine.run() executes each item exactly once -- a single green run cannot distinguish a reliable agent from a lucky one, and non-determinism is the normal case for a model-backed target. Adds an optional run.repetitions field (RunSettings, default 1, ge=1) that expands each selected item into k independent target.run(item) calls through the full scorer lifecycle, in both the sequential and parallel dispatch paths, retaining every raw attempt before any aggregate is computed. ItemResult gains attempt_index/attempt_id/item_run_id, appended last and emitted from RunResult.to_dict() only when set, so repetitions=1 output stays byte-identical to the pre-change harness. The scorer RNG (RunContext.rng) is freshly re-seeded from the item's own seed at the start of every attempt -- never advanced across attempts of the same item -- so a scorer that draws from ctx.rng cannot manufacture cross-attempt flakiness from RNG drift alone; every k-to-k difference is attributable to the target, not the harness. TargetRunner gains an optional is_deterministic() method (a plain method, not a @property -- a runtime_checkable Protocol's issubclass() support requires every member to be callable), which ModelTarget derives from temperature == 0.0. A new, pure ReliabilityAggregator (src/eval_harness/reliability.py; no I/O, clock or RNG) computes per (item, scorer): success count, empirical pass rate, pass@k (at least one of k attempts passes) and pass^k (all k attempts pass) as booleans, score quantiles over every attempt, and latency/cost quantiles scoped to successful attempts only -- pass^k is aggregated strictly per item and never pooled across items, so a suite of easy items cannot mask one that fails half the time. GateRule.metric is extended to accept pass_at_k/pass_power_k, wired into evaluate_gate() as the fraction of items whose own per-item boolean is True, computed lazily and at most once per gate (never eagerly on every run, and never re-derived from pooled raw attempts). A run-level RunResult.diagnostics carries a deterministic_sampling caveat -- 'pass^k is 1.0 because sampling is deterministic, not because the agent is reliable' -- emitted only when an item's pass^k is 1.0 and the target is declared, derived, or observed deterministic, and omitted entirely when empty (ADR 0029's vacuous-pass lesson: a metric that reports a pass having measured nothing)."
    category: "functional"
    priority: "high"
    status: "done"
    tier: "fast"
    verification:
      - "RunSettings.repetitions defaults to 1 (byte-identical legacy behaviour) and rejects values below 1; GateRule.metric accepts pass_at_k and pass_power_k; EvalConfig rejects an unknown top-level key (extra='forbid'), including a 'gates' typo of the real 'gate' field, which was previously silently ignored (F_056.py)"
      - "ItemResult's attempt_index/attempt_id/item_run_id are appended last and default to None, so historical positional construction still works, and a repetitions=1 run serialises with no attempt-identity keys and no 'reliability' key at all (F_056.py; ADR 0031's trajectory precedent extended to attempt identity)"
      - "repetitions=5 invokes the target exactly five times for one item -- no caching or memoisation between engine and target collapses the five draws into one -- with byte-identical input on every attempt, in both the sequential and parallel dispatch paths (F_056.py)"
      - "a scorer that draws from ctx.rng reports a stable draw and verdict across all five attempts of a deterministic target, in both dispatch paths -- the scorer's own randomness does not manufacture flakiness (F_056.py; mutation: reusing one continuously-advancing RNG instance across attempts instead of resetting it per attempt reproduces drift and fails this check)"
      - "per-attempt seeds are derived from the executing loop's own item index, not RunContext.item_index (which the legacy single-attempt sequential path never sets) -- two items' first-attempt draws are asserted to equal independently-reconstructed _make_item_rng(base_seed, item_index) values, not to merely differ (F_056.py; mutation: sourcing the seed from ctx.item_index instead collapses every item onto base_seed+0 in sequential mode)"
      - "TargetRunner.is_deterministic() defaults to None (unknown, not False) and every existing target stays a valid TargetRunner without change; ModelTarget.is_deterministic() is True at temperature=0.0 and False at temperature=0.7 (F_056.py)"
      - "the deterministic_sampling diagnostic is present for a deterministic, all-attempts-pass run and carries the exact code 'deterministic_sampling', and RunResult.to_dict() serialises it under a 'reliability' key only when non-empty (F_056.py)"
      - "ReliabilityAggregator: one-of-five passing attempts reports pass@5=True and pass^5=False; five-of-five reports both True; nine all-pass items plus one item passing only one of five attempts keeps that one item's own pass_power_k=False and pass_rate=0.2 independently inspectable -- nothing pools it into a falsely-reassuring aggregate, because ReliabilityReport exposes only per-item entries (F_056.py; mutation: pooling raw attempt counts across the ten items would report a falsely-high combined pass rate)"
      - "a pass_power_k gate rule passes when every item's attempts all pass and fails, with a failure reason naming the metric, the moment one item is unreliable -- GateResult.passed is what cli.py's eval command already maps unconditionally to sys.exit(1) (F_056.py)"
      - "ItemReliability.item_attempts reports the item's true repetition count even for a scorer conditionally absent on some attempts (e.g. F-057's judge-after-programmatic-failure skip), so a partial-participation scorer's own attempts field is never mistaken for the item's total repetition count (test_reliability.py; found by a branch-wide QA-lens review, not this proposal's own tests)"
      - "GateRule rejects a rule with neither min nor max set (a silent no-op in evaluate_gate()) and a rule with min > max (mathematically unsatisfiable), mirroring ComparisonConfig/ABCampaignConfig's own cross-field @model_validator pattern already established in the same file (F_056.py; found by the same review)"
    validation_command: "python scripts/validations/F_056.py"
    implemented_in: "c77aade04845d2d9171cdfd143a7a3a918db51a8"
    depends_on: ["F-051"]
    notes: "OpenSpec package: openspec/changes/add-repeat-reliability-metrics/ (proposal.md, design.md, tasks.md, review.md); authorised by ADR 0031. Second of five ordered changes from docs/plans/agent-eval-coverage/PLAN.md (F-051 was the first); the remaining three (stateful outcome evaluation, judge bias calibration, production flywheel) ship as reviewed proposals only. tasks.md groups the work as three notional PRs (PR1: configuration/attempt-identity/execution; PR2: aggregation/gating; PR3: governance); PR1 merged separately as PR #159, and PR2+PR3 (Groups 4-7, including this entry) landed together in one PR against the same branch. pass_at_k/pass_power_k gating is computed lazily inside evaluate_gate() rather than eagerly precomputed onto ScoreAggregate/RunResult -- a design decision made during implementation, not pre-specified in tasks.md, recorded in tasks.md Group 5 and repeat-reliability/spec.md. 'usage' and 'step count' distributions named in an earlier tasks.md draft were dropped: design.md's own aggregation contract never mentions them, and no target in this tree populates a token-usage field, so there was no real data to aggregate -- adding one would have been a fabricated schema ahead of any data source. Cost-per-success reads an optional TargetOutput.metadata['cost'] convention key and reports None, never a fabricated 0, since no target in this repo populates it yet. A post-landing branch-wide review (Product/SWE/SQE/Architect on the F-057 min_pairs fix, then SR Developer/QA/Architect/Automation on the whole branch) found two real corrections here, neither from this proposal's own tests: ReliabilityAggregator.aggregate() computed ItemReliability.attempts purely from a scorer's own recorded ScoreResults, so a judge-backed scorer conditionally skipped on some of an item's attempts (F-057's own skip logic, landed later in the same branch) silently undercounted -- fixed by adding a separate item_attempts field carrying the item's true repetition count, additive and with no change to attempts' existing tested semantics. GateRule (config/models.py) had no cross-field validation at all -- a rule with neither min nor max set was a silent no-op in evaluate_gate(), and a rule with min > max was a silently unsatisfiable one -- fixed with two @model_validator methods mirroring ComparisonConfig/ABCampaignConfig's own established pattern in the same file."

  - id: "F-057"
    epic: "Eval Harness"
    name: "Judge bias calibration (order, verbosity, self-preference)"
    description: "A judge can clear Cohen's kappa against a human label set while still preferring whichever answer it sees first, whichever is longer, or whichever its own model family produced -- agreement alone detects none of the three. Adds order-flip, verbosity-sensitivity and self-preference probe math to agent_core (dependency-free, importable from both sides of the eval_harness/flow_corpus airgap): order_flip_rate grades a pair in both answer orders and reports the disagreement/preference-shift rate; verbosity_preference_delta measures deviation from 50/50 among semantically-equivalent concise/expanded pairs, symmetric so a judge that penalises length is caught too, not just one that rewards it; self_preference_breakdown reports win rate broken down by whether the winner shares the judge's model family, informative only for pairs where exactly one candidate does. All three reuse the existing wilson_interval for their confidence intervals; a new ProbeConfig frozen dataclass (registered in FrameworkConfig like every sibling *Config) carries every tolerance. A new pairwise, order-swapped calibration corpus type (PairwiseItem/PairwiseSet) carries known-equal/clearly-better/clearly-worse canaries cross-validated against their own expected verdict at construction. A new, versioned JudgeCalibrationReport composes agreement (percent_agreement, a new standalone Cohen's-kappa-po function on agent_core.golden), kappa, every bias probe and the canary pass rate into a may_gate verdict and a failing_checks tuple naming every currently-failing check, not just the first; canary results are diagnostic only, never gating. agent_core cannot compute agreement itself -- flow_corpus sits downstream of agent_core in the dependency graph, so an agent_core -> flow_corpus import would be a reverse edge -- so JudgeCalibrationReport's agreement fields are populated by behavioral_regression (which already depends on both) via a new build_judge_calibration_report there, exported alongside the existing validate_judge, composing validate_judge's own KappaReport with percent_agreement over the same codeterminate pairs and pre-computed bias probes. In eval_harness: Scorer gains uses_judge() (a plain method, not a @property, for the same runtime_checkable-Protocol reason as TargetRunner.is_deterministic); EvalEngine stable-sorts scorers on it so judge-backed scorers always run after every programmatic one, and skips a judge entirely -- recording no ScoreResult at all -- once a programmatic scorer has already failed the item, so a judge's verdict can never convert that item into a pass. A new JudgeCalibrationGateConfig (calibration_artifact_id, required, non-empty) on EvalConfig names the calibration run that authorises a judge to gate; eval_harness.gating.require_calibration_for_judge_gating rejects a gate rule that targets a judge-backed scorer (checked against the real, constructed Scorer's resolved name/uses_judge(), not guessed from raw config) with no named artifact; eval_harness.agent_core_adapter.require_report_to_gate then enforces a real JudgeCalibrationReport against that name, requiring both a matching artifact_id and may_gate."
    category: "functional"
    priority: "high"
    status: "done"
    tier: "fast"
    verification:
      - "order_flip_rate translates the swapped-order verdicts back to original terms before comparing, so a pair whose winner is unchanged once translated is not counted as a flip, and one whose winner does change is (F_057.py)"
      - "verbosity_preference_delta's expanded_win_rate reflects the share of non-tied pairs won by the expanded answer (F_057.py)"
      - "self_preference_breakdown treats a pair as informative only when exactly one candidate shares the judge's family -- a pair where neither side does contributes nothing to same_family_n, and every informative pair is independently checkable in the win rate (F_057.py)"
      - "order_flip_rate, verbosity_preference_delta and self_preference_breakdown each fail (passes=False, with a degenerate reason naming the shortfall) once their informative-pair count is below cfg.min_pairs, even when the measured rate already clears its own tolerance; the default ProbeConfig (min_pairs=1) can never trip this floor (F_057.py)"
      - "PairwiseItem rejects an internally-inconsistent canary at construction (a known_equal canary with expected != 'tie'); PairwiseSet rejects duplicate item_ids (F_057.py)"
      - "JudgeCalibrationReport.may_gate is False when a bias check fails even with acceptable agreement, and failing_checks names every currently-failing check, not just the first (F_057.py; mirrors ADR 0029: acceptable kappa is not sufficient on its own)"
      - "build_judge_calibration_report computes the canary pass rate by comparing each canary's actual verdict against its own expected field, and rejects an empty canary list rather than silently reporting a vacuous 100% (F_057.py)"
      - "EvalEngine orders every programmatic scorer ahead of every judge-backed one and skips a judge -- recording no ScoreResult -- once a programmatic scorer has failed the item; a duck-typed scorer that never defines uses_judge() does not crash the engine (F_057.py; mutation: recording a synthetic skip value would silently shift the judge's aggregate mean, caught in tasks.md by config/eval.example.yaml's own CLI smoke test)"
      - "JudgeCalibrationGateConfig.calibration_artifact_id is required and rejects an empty string; require_calibration_for_judge_gating raises when a gate rule targets a judge-backed scorer's real, resolved name with no artifact named, passes once one is, and needs nothing when the gate does not target the judge (F_057.py)"
      - "require_report_to_gate rejects an artifact_id that does not match the configured name and a report whose may_gate is False (naming the failing check in the error), and allows a matching, authorising report through (F_057.py)"
      - "require_report_to_gate's error names an undersized probe's degenerate reason alongside the bare check name (e.g. 'order_flip (insufficient pairs: n=1 < min_pairs=30)'), so a caller can tell a real bias failure from an underpowered run without re-fetching the full report (F_057.py)"
      - "behavioral_regression.build_judge_calibration_report's kappa and percent_agreement both reflect the same underlying agreement measurement (perfect agreement gives both 1.0), never re-derived independently; agent_core.percent_agreement is importable standalone from the agent_core package root (F_057.py)"
    validation_command: "python scripts/validations/F_057.py"
    implemented_in: "1cfc342f7aed79e532f4a8e8e5d5a86cbf03566f"
    depends_on: ["F-056"]
    notes: "OpenSpec package: openspec/changes/extend-judge-calibration/ (proposal.md, design.md, tasks.md); authorised by ADR 0031. Third of five ordered changes from docs/plans/agent-eval-coverage/PLAN.md (F-051, F-056 came first). Landing order was constrained, not arbitrary: this proposal's 'scorers ordered ahead of judges' requirement is item-level and belongs in _run_one's scorer loop -- exactly the function F-056 restructures into a per-attempt loop -- so this landed after F-056, rebasing cleanly rather than the reverse. Architectural finding recorded in tasks.md Group 3, not pre-specified: agent_core cannot call flow_corpus.oracles.kappa_gate.validate_oracle itself (a reverse edge across the eval_harness/flow_corpus airgap), so JudgeCalibrationReport's agreement fields are populated by its Group 4 caller (behavioral_regression), never by agent_core itself; architecture.yaml carries no new component edge for this proposal. Two real design corrections made during implementation, both found by running the full test suite rather than by reasoning alone (tasks.md Group 4 has the full account): a skipped judge's ScoreResult was first given a synthetic value=0.0 placeholder mirroring AutoevalsScorer's on_skip convention, which silently corrupted the judge's aggregate mean for any downstream mean-based gate -- fixed by recording nothing at all for the skip; and the calibration-artifact-ID requirement was first checked at EvalConfig parse time against any judge+gate combination, which broke roughly a dozen unrelated passing tests where a configured judge simply wasn't the scorer being gated on -- fixed by moving the check to eval_harness.gating.require_calibration_for_judge_gating, called from cli.py against the engine's real, constructed Scorer instances once they exist, not guessed from raw config. A third correction was found post-implementation by an automated PR review (not the test suite): ProbeConfig.min_pairs was documented as a sample-size floor but never enforced in any of the three probe functions, so a probe on a handful of pairs could report passes=True purely by chance -- fixed by adding a degenerate: str | None field (mirroring agent_core.calibration.CalibrationReport's own field of that name) and ANDing passes with a not-undersized check in all three, following the exact pattern agent_core.calibration.evaluate_calibration already established for the same class of floor. A fourth correction was found by an internal four-lens (Product/SWE/SQE/Architect) review dispatched specifically to check that third correction's own completeness: the new degenerate reason was computed but never reached the one real place a human or CI log would see it -- eval_harness.agent_core_adapter.require_report_to_gate's raised message named only the bare failing-check name (e.g. 'order_flip'), so a real bias failure and a merely-undersized run still looked identical at the point that matters -- fixed by threading each failing check's degenerate reason into that message via a small _describe_failing_check helper, without adding any field to JudgeCalibrationReport itself or touching failing_checks' own name-tuple contract."

