      - "the all-skills job runs skill_marketplace.py validate and check_skill_script_drift.py, making the drift guard reachable on every skill's own changes for the first time (F_050.py)"
      - "every skills/*/ directory is asserted to be registered in marketplace.yaml and to have either a dedicated skills-ci.yml job or a documented EXEMPT entry, structured on the docs.yml component-README guard's derived-list + dict[name, reason] EXEMPT idiom (F_050.py)"
