  - id: "F-051"
    epic: "Eval Harness"
    name: "Agent trajectory evaluation (normalized tool-call trace + seven trajectory scorers)"
    description: "Closes the largest gap an external coverage analysis identified and this repo's peer review confirmed (docs/plans/agent-eval-coverage/REVIEW.md): every built-in scorer read output.output only, so an agent returning plausible text via an invalid, wasteful, looping or policy-violating path scored identically to one that did the work. Langfuse tracing existed but tracing is not scoring -- spans are exported for human inspection and never enter a verdict. Adds immutable ToolCallRecord/TrajectoryStep/AgentTrajectory value objects and an optional AgentTrajectory appended LAST to TargetOutput, which stays mutable with its existing field order (freezing and reordering, as the external plan proposed, would break every mutation site and all positional construction). Capture is target-owned; Langfuse remains an export sink, so the offline path keeps its zero-network property. core/_trajectory.py is pure: tool-name and recursive argument canonicalization with stable key ordering, a configurable ignored-field set for volatile values applied at any depth, and duplicates PRESERVED -- duplicates are the precision and loop signal, so matching is over multisets, not sets. Seven scorers land in scorers/trajectory.py (a new module: scorers/__init__.py was already at 316 of the 500-line check_size_budget.py ceiling): four reference-matching (exact, in_order, any_order, precision_recall, the last reporting precision and recall separately because low precision is wasted work and low recall is work undone) and three reference-free quality scorers (step_efficiency, loop_detection, recovery). A missing trajectory yields passed=None with a comment, reusing AutoevalsScorer's skipped-scorer convention rather than a third status enum: _aggregate excludes None from pass_rate, so a text-only target is no longer silently failed on every item -- but the emitted value still enters the mean, so on_missing is a documented operator knob, not a hidden constant. RunResult.to_dict() omits the trajectory key when absent, so historical result JSON is byte-identical. Authorized by ADR 0031, which amends CHARTER 4 invariant 1 (core models stay unmodified) narrowly and additively; the eval_harness/flow_corpus airgap is explicitly NOT amended."
    category: "functional"
    priority: "high"
    status: "done"
    tier: "fast"
    verification:
      - "TargetOutput gains trajectory as its LAST field and stays mutable: historical positional construction TargetOutput(output, latency_ms, error, metadata) still works and the dataclass is still assignable (F_051.py; ADR 0031 obligations 1-2)"
      - "a run with no trajectory on any item serializes without a trajectory key at all, so pre-F-051 result JSON is byte-identical (F_051.py; ADR 0031 obligation 4)"
      - "exact matching fails and in-order matching passes on the same A,X,B candidate against an A,B reference -- the pair of scenarios that distinguishes the two modes (F_051.py)"
      - "any-order matching passes on B,A against A,B and is a multiset not a set: a reference asking for two lookups is not satisfied by one (F_051.py)"
      - "a candidate that repeats one required call and omits another reports reduced precision AND reduced recall as separate numbers in ScoreResult.metadata (F_051.py)"
      - "a fourteen-step trajectory against a four-step budget reports the excess via step_efficiency while outcome scorers are free to pass, keeping success and efficiency two separate facts (F_051.py)"
      - "an agent that claims success after an unrecovered tool error fails trajectory_recovery, while a retry, a fallback, or stopping without claiming success all pass (F_051.py)"
      - "a text-only target scored by any of the seven trajectory scorers gets passed=None, not a failing 0.0, and is therefore excluded from that scorer's aggregate pass_rate (F_051.py; mutation: returning passed=False would drag a text-only suite's pass rate to zero)"
      - "normalization canonicalizes names and nested argument key ordering, drops configured volatile fields at any depth, and preserves duplicate calls (F_051.py)"
      - "canonicalization is stable ACROSS interpreter processes: sets are sorted by canonical representation and unknown types render as type:value, so no canonical form contains a memory address (F_051.py; mutation: json.dumps(default=str) reintroduces the address and the cross-seed sweep fails)"
      - "ToolCallRecord.arguments and TrajectoryStep.metadata are read-only mappings, so a constructed value object cannot change its own canonical form after construction (F_051.py)"
      - "unscoreable input yields passed=None, never passed=False: arguments nested past max_depth, and a reference call whose arguments are not a mapping, both report not-applicable rather than failing the agent (F_051.py)"
      - "trajectory_recovery is linear in trajectory length and emits both tool_errors and unrecovered_tools on the pass AND fail branches (F_051.py; mutation: the pre-fix per-error tail slice makes a 5000-error trajectory quadratic)"
    validation_command: "python scripts/validations/F_051.py"
    implemented_in: "a5e1a7847f4cb64dbe46135176923e1d0e500fc2"
    depends_on: ["F-020"]
    notes: "Peer-reviewed OpenSpec package in openspec/changes/archive/add-agent-trajectory-evaluation/; decision recorded in ADR 0031. First of five ordered changes from docs/plans/agent-eval-coverage/PLAN.md; the remaining four (repeat reliability, stateful outcome, judge bias calibration, production flywheel) ship as reviewed proposals only. The external plan this supersedes would have failed CI on first push: it froze and reordered TargetOutput, tasked seven scorers into an already-near-limit file, invented a gate config block that strict from_dict rejects, and never mentioned the F-039 surface baselines."
  - id: "F-052"
    epic: "Quality Gate"
    name: "Protected-path guard reachability (PROTECTED_PATTERNS vs the CI path filter)"
    description: "The eval-integrity guard is only as good as the set of PRs it runs on, and that set is decided by a SECOND list -- quality-gates.yml's on.pull_request.paths -- which nothing asserted agreed with scripts/eval_protected_paths.py::PROTECTED_PATTERNS. They had drifted: 9 of 15 protected patterns could not trigger the guard at all. Unreachable were features.schema.json, config/**, all five sibling */tests/** roots, .github/** beyond the workflows/ and actions/ prefixes (so CODEOWNERS -- the file that makes the label gate mean anything -- sat outside it), and architecture.yaml, which is protected precisely because editing its declared component edges could quietly dissolve the eval_harness/flow_corpus airgap (F-011). A PR touching only any of those ran no protected-path check and merged without the eval-change-approved label ever being demanded. This is the same class of defect the workflow's own push-filter comment already records ('PR #64 merged through that gap and left F-031/F-037 red on main, undetected'), recreated one trigger over. scripts/check_guard_reachability.py closes the loop mechanically rather than by re-syncing once: it IMPORTS PROTECTED_PATTERNS (never restates it -- a second copy would recreate the exact divergence it exists to prevent) and reuses that module's _glob_to_regex, so its matching agrees with the guard's own by construction. Registered in check_charter_invariants.py's _EXPECTED_GATE_SCRIPTS, so removing it from CI fails a different gate."
    category: "infrastructure"
    priority: "high"
    status: "done"
    tier: "fast"
    verification:
      - "every entry in PROTECTED_PATTERNS is matched by at least one on.pull_request.paths filter in the workflow that invokes check_protected_changes.py (F_052.py)"
      - "the check FAILS when any covering filter is removed -- asserted by mutation over architecture.yaml, config/**, agent-core/tests/** and .github/** (F_052.py; a guard that stops detecting drift is worse than none, because the green tick is read as evidence)"
      - "PROTECTED_PATTERNS is imported rather than restated, and glob matching reuses eval_protected_paths._glob_to_regex, so the checker cannot disagree with the guard it audits (F_052.py)"
      - "path-boundary semantics hold: tests/** does not match testsuite/x.py, and .github/workflows/** does not match .github/CODEOWNERS (F_052.py)"
      - "filters declared under push/schedule triggers are not counted as pull_request coverage (F_052.py)"
      - "--json output is byte-stable for a given input, so a report is diffable and committable (F_052.py)"
