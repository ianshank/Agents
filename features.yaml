  - id: "F-047"
    epic: "Quality Gate"
    name: "Proxy-correlation measurement, PPI++ report estimator & audit-selection propensity"
    description: "Answers the question that governs whether borrowing statistical strength is worth wiring: how well does a cheap, always-available proxy predict the authoritative HUMAN_AUDIT label -- on the subsets the gate actually operates over? agent_core.proxy_eval reports marginal AND conditional correlation (score >= candidate tau, per bin) with the implied 1/(1-rho^2) effective-sample multiplier; proxies are pluggable via a ProxyExtractor Protocol so an external LLM judge arrives through MappingProxy without agent_core gaining a dependency. agent_core.ppi adds a power-tuned prediction-powered interval that reduces exactly to the classical estimator at lambda=0 and is FAIL-CLOSED: too few labels, a single outcome class, a constant proxy, an out-of-range proxy, or no residual degrees of freedom all return the Wilson interval with a stated reason. calibration_report grows --estimator {wilson,ppi++}, dual-reporting both plus the same-family classical baseline the reduction is measured against. OutcomeRecord.selection_propensity is recorded end-to-end (merge-gate-audit selects --with-propensity, audit_issue_sync carries it into the issue and the dispatch command, merge-gate-verdict + record_audit_verdict thread it to the write boundary) so audits can later be reweighted by 1/p -- a quantity that cannot be reconstructed once the round is over. The GATE IS UNTOUCHED: decide(), tau, wilson_floor, risk_target and min_calibration_n are unchanged, auto-merge stays off, and neither merge_gate nor merge_gate_ci imports the estimator or the report modules. numpy: not used anywhere in this change (agent_core stays dependency-free; all five new modules are pure stdlib)."
    category: "non-functional"
    priority: "medium"
    status: "done"
    tier: "fast"
    verification:
      - "the gate is untouched and unreachable from the new reporting modules: merge_gate still calls wilson_interval, and neither merge_gate nor merge_gate_ci imports ppi/proxy_eval/calibration_report (F_047.py)"
      - "wilson remains the report default and ppi++ is opt-in; the estimator name is single-sourced in report_types (F_047.py, agent-core/tests/test_calibration_report.py)"
      - "PPI++ is fail-closed: every guarded path returns the Wilson interval with a reason, and min_labeled >= 3 because a tuned lambda costs the residual a second degree of freedom (F_047.py, agent-core/tests/test_ppi.py)"
      - "variance_reduction is derived from the standard errors, not the [0,1]-clipped bounds -- sliding only the unlabeled proxy mean must not change it, and a genuine widening reports negative (agent-core/tests/test_ppi.py)"
      - "a degenerate slice withholds AUROC instead of printing the by-construction 0.5, matching calibration_report (F_047.py, agent-core/tests/test_proxy_eval.py)"
