schema_version: "1.0.0"

# Top-level importable packages grimp analyses. They are made importable via
# sys_path below (no install required — grimp parses statically).
root_packages:
  - eval_harness
  - agent_core
  - flow_protocol
  - flow_corpus
  - behavioral_regression

# Resolved relative to this manifest's directory (the repo root), so the gate is
# portable — it can be run from any working directory.
sys_path:
  - "src"
  - "agent-core"
  - "flow-protocol"
  - "flow-corpus"
  - "behavioral-regression"

# Component model — mirrors docs/c4_architecture.md (L3 Component view). Each
# component owns one package prefix; modules resolve to the longest match.
components:
  core: [eval_harness.core]
  plugins: [eval_harness.plugins]
  scorers: [eval_harness.scorers]
  judges: [eval_harness.judges]
  datasets: [eval_harness.datasets]
  targets: [eval_harness.targets]
  sinks: [eval_harness.sinks]
  # Local, deterministic StateAdapter implementations (in_memory, filesystem, sqlite,
  # mock_http; F-060) the engine snapshots around target.run when a state_adapter is
  # configured. No production credentials, no domain adapters, no network I/O — the
  # offline suite's zero-external-dependency property holds. Depends on core (the
  # Protocol/value types) and plugins (the STATE_ADAPTERS registry object) only —
  # never flow_corpus or agent_core, so the eval_harness <-> flow_corpus airgap and
  # the airgap-safety review this component was flagged for (ADR 0031 errata) both
  # hold: this edge list touches neither.
  state_adapters: [eval_harness.state_adapters]
  gating: [eval_harness.gating]
  # Pure reliability-metrics aggregation (pass@k / pass^k over repeated attempts,
  # F-056). No I/O, clock or RNG; depends on core only. gating imports it on
  # demand, lazily, when a gate rule asks for pass_at_k/pass_power_k — engine
  # does NOT depend on it: its own deterministic_sampling diagnostic is a
  # deliberately local, minimal check that ships before this module exists.
  reliability: [eval_harness.reliability]
  config: [eval_harness.config]
  langfuse_client: [eval_harness.langfuse_client]
  # Phoenix seam — mirrors langfuse_client. Real arize-phoenix-* packages are imported
  # lazily so the offline suite runs with zero external dependencies. See
  # docs/phoenix-spike.md for the reversible-adoption pattern.
  phoenix_client: [eval_harness.phoenix_client]
  # BrainTrust experiment-export seam — mirrors phoenix_client/langfuse_client. The real
  # `braintrust` SDK is imported lazily so the offline suite runs with zero external
  # dependencies. See docs/braintrust-spike.md for the reversible-adoption pattern.
  braintrust_client: [eval_harness.braintrust_client]
  agent_core_adapter: [eval_harness.agent_core_adapter]
  engine: [eval_harness.engine]
  cli: [eval_harness.cli]
  agent_core: [agent_core]
  # Flow-calibration corpus + the airgap seam. flow_protocol is the ONLY shared
  # surface; flow_corpus may depend on flow_protocol and agent_core but NEVER on
  # eval_harness (and eval_harness must never depend on flow_corpus). The absence
  # of those edges below is the structural airgap.
  flow_protocol: [flow_protocol]
  flow_corpus: [flow_corpus]
  # Behavioral-regression detector — a sibling consumer of the corpus + harness
  # primitives. It depends on flow_corpus and agent_core but NEVER on eval_harness
  # (the airgap holds for this consumer too). The optional live judge edge stays
  # inside eval_harness.judges; this package stays offline.
  behavioral_regression: [behavioral_regression]

# Declared DIRECT component edges. Seeded from `drift_check.py --emit-actual` and
# reviewed: core depends on nothing; dependencies flow inward; no layering
# inversions. Add an edge here only when a new dependency is intended.
dependencies:
  agent_core_adapter: [agent_core, config, core]
  flow_corpus: [flow_protocol, agent_core]
  behavioral_regression: [agent_core, flow_corpus]
  cli: [config, engine, gating, langfuse_client, phoenix_client, plugins]
  datasets: [braintrust_client, core, langfuse_client, plugins]
  # engine -> gating added with the gate-decision-provenance change: the gate is
  # evaluated inside EvalEngine.run() *before* the sinks emit, so every exported
  # artifact carries the verdict. Acyclic -- gating depends on config/core/reliability
  # and never on engine -- and it is the layering the CLI already had (cli -> both).
  engine: [agent_core_adapter, config, core, gating, langfuse_client, plugins]
  gating: [config, core, reliability]
  judges: [core, langfuse_client, plugins]
  plugins: [core, datasets, judges, scorers, sinks, state_adapters, targets]
  reliability: [core]
  scorers: [core, plugins]
  sinks: [braintrust_client, core, langfuse_client, phoenix_client, plugins]
  state_adapters: [core, plugins]
  targets: [core, plugins]

output:
  mermaid_path: architecture.mmd
  title: Langfuse Eval Harness — Component View
