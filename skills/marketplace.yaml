# Skill Marketplace registry.
#
# A centralized, schema-validated index of community-contributed skills. Each
# entry's `version` must match the SKILL.md frontmatter `version` (semver), and
# every registered skill must pass structural validation (scripts/validate_skill.py).
# Validate with: python scripts/skill_marketplace.py validate
registry_version: 1.0.0
skills:
  - name: common
    version: 1.0.0
    path: skills/common
    description: Shared skill validator and utility library for skill marketplace.
    compatibility: python>=3.10
  - name: openai-judge
    version: 1.1.0
    path: skills/openai-judge
    description: LLM-as-a-judge evaluations over OpenAI-compatible APIs.
    compatibility: python>=3.10
  - name: architecture-drift-guard
    version: 1.0.0
    path: skills/architecture-drift-guard
    description: Detect and block architecture drift in CI against a declared C4 component model.
    compatibility: python>=3.10, grimp, pyyaml
  - name: eval-corpus-forge
    version: 1.0.0
    path: skills/eval-corpus-forge
    description: Build, validate, and package reusable evaluation datasets for agent and LLM systems.
    compatibility: python>=3.10
  - name: model-bench
    version: 1.0.0
    path: skills/model-bench
    description: Benchmark and A/B-test multiple LLMs on one dataset (multi-model comparison + A/B campaigns).
    compatibility: python>=3.10, langfuse-eval-harness
  - name: project-setup
    version: 1.1.0
    path: skills/project-setup
    description: Generate a deterministic, self-documenting Makefile for a Python project from its detected toolchain (monorepo workspace fan-out supported).
    compatibility: python>=3.10 (tomli on 3.10)
  - name: quality-gate
    version: 1.2.0
    path: skills/quality-gate
    description: Generate a deterministic quality-gate shell script (lint + type + test + coverage) that CI and make check both call.
    compatibility: python>=3.10 (tomli on 3.10)
  - name: deploy
    version: 1.0.0
    path: skills/deploy
    description: Generate a safety-railed deployment script (strict mode, dry-run, confirm gate, rollback, health check).
    compatibility: python>=3.10
  - name: hierarchical-recursive-brainstorm
    version: 1.0.0
    path: skills/hierarchical-recursive-brainstorm
    description: Decomposes a topic into a controlled hierarchy, recursively expands leaves, prunes the bottom quartile, and synthesizes upward into a self-explanatory Markdown tree. Use this whenever the user asks to research a complex topic, brainstorm agent evaluation patterns, or requires a rigorous structural breakdown of ideas.
    compatibility: python>=3.10
  - name: openspec-quality-plan
    version: 1.0.0
    path: skills/openspec-quality-plan
    description: Generates a complete OpenSpec change package containing proposal, design, and task specs. Use this whenever the user asks to create an implementation plan, an OpenSpec package, or convert a research leaf node into a concrete project plan.
    compatibility: python>=3.10
  - name: openspec-peer-review
    version: 1.1.0
    path: skills/openspec-peer-review
    description: Emits an objective Peer Review Findings section and rewrites an OpenSpec package to satisfy quality standards. Use this whenever the user asks to review, critique, or polish an existing plan, or as the final step in generating an OpenSpec package.
    compatibility: python>=3.10
  - name: dataset-lint
    version: 1.0.0
    path: skills/dataset-lint
    description: Validate existing eval datasets for structural correctness, duplicate IDs, and encoding issues.
    compatibility: python>=3.10
  - name: repo-invariant-review
    version: 1.0.0
    path: skills/repo-invariant-review
    description: Predict CI collisions with this repo's enforced invariants (protected paths, airgap, size budget, frozen baselines, CHARTER invariant 1) before pushing.
    compatibility: python>=3.10
