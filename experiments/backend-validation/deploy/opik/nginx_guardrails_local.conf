# Official Opik 1.7.26 guardrails-flavor nginx conf, taken verbatim from the tag
# (deployment/docker-compose/nginx_guardrails_local.conf) except the /api/ upstream is
# renamed to THIS stack's service name (backend -> opik-backend); the /guardrails/
# upstream keeps the name `guardrails`, which our compose service/hostname must match.
# The frontend image bakes in NO conf: compose.yaml mounts this file read-only at
# /etc/nginx/conf.d/default.conf, or nothing listens on 5173 at all.
# Hand-maintained, reviewed at P0 sign-off alongside the compose file.
server {
    listen 5173;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        rewrite /api/(.*) /$1  break;
        proxy_pass http://opik-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 90;
        proxy_connect_timeout 90;
        proxy_send_timeout 90;

        proxy_http_version 1.1;
        client_max_body_size 500M;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /guardrails/ {
        rewrite /guardrails/(.*) /$1  break;
        proxy_pass http://guardrails:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 90;
        proxy_connect_timeout 90;
        proxy_send_timeout 90;

        proxy_http_version 1.1;
        client_max_body_size 500M;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
