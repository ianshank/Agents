# Opik self-hosted stack (probe target). Hand-maintained config, reviewed at P0 sign-off;
# tune against the official opik docker-compose for the pinned version if images evolve.
# Same rules as the Langfuse stack: digest-pinned images only (TODO_PIN -> `make
# pin-digests`), ${VAR:?} for secrets, loopback ports, named volumes — plus exactly one
# read-only in-subtree config bind mount (the nginx conf on opik-frontend; zero-writes is
# about container writes to the host, and bind_mounts_inside still checks containment).
name: bv-opik

services:
  mysql:
    image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    environment:
      MYSQL_ROOT_PASSWORD: ${BV_OPIK_MYSQL_PASSWORD:?set in .env.local}
      MYSQL_DATABASE: opik
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine@sha256:b002e56ed5c16e224c312527f6fcba7e77216fec5d7a88a7828f59efc614feb5
    environment:
      CLICKHOUSE_USER: opik
      CLICKHOUSE_PASSWORD: ${BV_OPIK_CH_PASSWORD:?set in .env.local}
      CLICKHOUSE_DB: opik
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user opik --password $$CLICKHOUSE_PASSWORD --query 'SELECT 1' || clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - opik-ch-data:/var/lib/clickhouse

  opik-backend:
    image: ghcr.io/comet-ml/opik/opik-backend:1.7.26@sha256:3f8ff690871daccf181346347f1fe429b301a6b187bce829d5cc845349c81ea0
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
    # No minio on purpose: at 1.7.26 the backend's S3 settings are fully env-defaulted
    # (apps/opik-backend/config.yml s3Config: s3Url ${S3_URL:-http://minio:9000},
    # isMinIO true, bucket `public`) and /health-check registers only deadlocks/db/
    # redis/clickhouse/mysql — S3 is touched lazily by the attachments feature, which
    # no probe exercises, so the backend boots healthy without an object store.
    environment:
      STATE_DB_URL: "jdbc:mysql://mysql:3306/opik?rewriteBatchedStatements=true"
      STATE_DB_DATABASE_NAME: opik
      STATE_DB_USER: root
      STATE_DB_PASS: ${BV_OPIK_MYSQL_PASSWORD:?}
      ANALYTICS_DB_MIGRATIONS_URL: "jdbc:clickhouse://clickhouse:8123"
      ANALYTICS_DB_HOST: clickhouse
      ANALYTICS_DB_DATABASE_NAME: opik
      ANALYTICS_DB_USERNAME: opik
      ANALYTICS_DB_PASS: ${BV_OPIK_CH_PASSWORD:?}
      REDIS_URL: redis://redis:6379/0
      # Server-side Python evaluator (online judge rules execute there); the image
      # default is in-container localhost:8000, which is dead under compose.
      PYTHON_EVALUATOR_URL: http://opik-python-backend:8000
      # Server-side feature flag, default false: without it the API rejects guardrails
      # results even while the guardrails service itself is up.
      TOGGLE_GUARDRAILS_ENABLED: "true"
      # airgap dual-scoring lever (spec R8). As shipped (true) this backend phones home
      # to OPIK_USAGE_REPORT_URL, default https://stats.comet.com/notify/event/ — the
      # exact egress the P4 witness expects to record in as-shipped mode.
      OPIK_USAGE_REPORT_ENABLED: ${BV_OPIK_USAGE_REPORT:-true}
    networks:
      # Server-side evaluators (online judge rules) dial the judge over the shared
      # bv-judge-net docker network (JudgeSpec.container_base_url -> http://bv-judge:11434).
      # A host-gateway alias would NOT work: the judge publishes on the host's 127.0.0.1
      # only, which is unreachable from containers by design (loopback-ports rule).
      # run_deploy ensure-creates the external network before any stack comes up; the
      # airgap overlay `!override`s this list so the sealed stack never touches it.
      - default
      - judge-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health-check || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  opik-python-backend:
    image: ghcr.io/comet-ml/opik/opik-python-backend:1.7.26@sha256:35374fc93b46a1f7c0633b6bde3c045cef91ce39985226e1832c1a51977c7dd9
    depends_on:
      opik-backend: {condition: service_healthy}
    # NOTE: no OPIK_USAGE_REPORT_ENABLED here — the 1.7.26 python backend never reads
    # it (the copy this stack used to carry was dead env); the lever lives on opik-backend.
    environment:
      OPIK_REVERSE_PROXY_URL: http://opik-frontend:5173/api
    # Official 1.7.26 healthcheck verbatim (the file-exists guard keeps images that
    # predate the healthcheck endpoint from flapping).
    healthcheck:
      test: ["CMD", "sh", "-c", "if [ -f /opt/opik-python-backend/src/opik_backend/healthcheck.py ]; then wget --spider --quiet http://127.0.0.1:8000/healthcheck; else exit 0; fi"]
      interval: 2s
      timeout: 60s
      retries: 30
      start_period: 2s

  # Guardrails backend — the matrix cell where Opik claims native support (Langfuse is
  # the negative control). The official compose gates this behind `--profile guardrails`;
  # this probe stack ALWAYS starts it (deliberate deviation: the guardrails probes are
  # unconditional, so the cell must not depend on a profile flag). CUDA-capable image
  # with automatic CPU fallback on GPU-less hosts, and it is LARGE (multi-GB) — expect
  # the P1 ops-burden metrics (pull time, footprint) to shift accordingly.
  guardrails:
    # nginx routes /guardrails/ to http://guardrails:5000 — the service name and
    # hostname must both stay `guardrails` (see nginx_guardrails_local.conf).
    image: ghcr.io/comet-ml/opik/opik-guardrails-backend:1.7.26@sha256:8a47859fed49470071ba1f2133212a403d4a0272f1b196626cad7c5d3d4523d4
    hostname: guardrails
    # Official 1.7.26 healthcheck verbatim. No published ports: reachable only through
    # the frontend nginx proxy on 5173.
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --spider --quiet http://127.0.0.1:5000/healthcheck"]
      interval: 2s
      timeout: 60s
      retries: 30
      start_period: 10s

  opik-frontend:
    image: ghcr.io/comet-ml/opik/opik-frontend:1.7.26@sha256:1ba821742dd21d50d22f9cfe80bb9ad3fee2f6dbfa84c849c6055a3a939d7f33
    depends_on:
      opik-backend: {condition: service_healthy}
      opik-python-backend: {condition: service_healthy}
      # nginx resolves the static `guardrails:5000` upstream ONCE at config load; if the
      # guardrails container (multi-GB image) has no DNS record yet, nginx exits with
      # "host not found in upstream" and the frontend healthcheck can never pass.
      guardrails: {condition: service_started}
    ports:
      - "127.0.0.1:${BV_OPIK_PORT:-18322}:5173"
    volumes:
      # The official frontend image bakes in NO nginx conf — the official compose mounts
      # one in, and without it nothing listens on 5173 at all (the healthcheck below can
      # never pass). Guardrails flavor: /api/ -> opik-backend:8080, /guardrails/ ->
      # guardrails:5000.
      - ./nginx_guardrails_local.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  mysql-data:
  opik-ch-data:

networks:
  # Shared with the judge stack (deploy/judge/compose.yaml) so server-side evaluators can
  # reach the judge container-to-container. External: created by run_deploy (idempotent
  # `docker network create bv-judge-net`), owned by no compose project.
  judge-net:
    name: bv-judge-net
    external: true
