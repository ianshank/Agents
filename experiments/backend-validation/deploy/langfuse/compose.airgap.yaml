# Air-gap overlay (P4): docker compose -f compose.yaml -f compose.airgap.yaml -p
# bv-langfuse-airgap. Hand-maintained, reviewed at P0 sign-off with the base file, and
# statically validated by check_overlay before any `up`.
#
# Mechanics: EVERY base service is re-declared with `networks: [bv-internal]`, which
# detaches the implicit default network — the stack still name-resolves itself but has
# no route out (`internal: true`). Published ports are stripped with `ports: !reset []`
# (the !reset tag is load-bearing: a plain `ports: []` merges to a no-op). Every app
# service's DNS points at the CoreDNS witness on the static .53 address, which logs
# every query and answers NXDOMAIN — any external-name lookup landing there is recorded
# egress evidence, and the pre-run canary lookup proves the witness is alive even when
# a clean opt-out run logs nothing else.
services:
  postgres:
    networks: [bv-internal]
    dns: [172.31.100.53]
    depends_on:
      bv-dns-witness: {condition: service_started}

  redis:
    networks: [bv-internal]
    dns: [172.31.100.53]
    depends_on:
      bv-dns-witness: {condition: service_started}

  clickhouse:
    networks: [bv-internal]
    dns: [172.31.100.53]
    depends_on:
      bv-dns-witness: {condition: service_started}

  minio:
    networks: [bv-internal]
    dns: [172.31.100.53]
    depends_on:
      bv-dns-witness: {condition: service_started}

  langfuse-worker:
    # `!override` (not a plain list): the base attaches this service to the shared
    # bv-judge-net as well, and compose UNIONS explicit network lists on merge — a
    # plain [bv-internal] here would leave a non-internal egress path into the seal.
    networks: !override [bv-internal]
    dns: [172.31.100.53]
    depends_on:
      bv-dns-witness: {condition: service_started}

  langfuse-web:
    networks: [bv-internal]
    dns: [172.31.100.53]
    depends_on:
      bv-dns-witness: {condition: service_started}
    ports: !reset []

  bv-dns-witness:
    image: coredns/coredns:1.12.1@sha256:e8c262566636e6bc340ece6473b0eed193cad045384401529721ddbe6463d31c
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ../witness/Corefile:/etc/coredns/Corefile:ro
    networks:
      bv-internal:
        ipv4_address: 172.31.100.53

# Explicit deterministic network name: the prober/canary containers join it via
# `docker run --network`, which must not depend on compose project-name mangling.
networks:
  bv-internal:
    internal: true
    name: bv-langfuse-internal
    ipam:
      config:
        - subnet: 172.31.100.0/24
