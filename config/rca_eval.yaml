# RCA evaluation (synthetic scope) — five deterministic scorers over a ranked
# root-cause diagnosis, plus the max-|Z| baseline target evaluated on the identical
# item set (spec: "the baseline runs on the same corpus").
#
# Run:
#   eval-harness run --config config/rca_eval.yaml
#
# The dataset ships with the repository: `corpora/rca/v1/eval/items.jsonl` is the frozen
# synthetic corpus (generated by `scripts/gen_rca_corpus.py`; `--check` gates drift and
# difficulty calibration). The default target below is the max-|Z| BASELINE — the floor
# every agent is measured against. To evaluate an agent, point `target` at it and keep
# the rest of this file unchanged; report the baseline's result alongside (task 6.2).

schema_version: "1.0"

run:
  name: "rca-eval"
  seed: 7

dataset:
  type: jsonl
  params:
    path: "corpora/rca/v1/eval/items.jsonl"

target:
  type: rca_maxz

scorers:
  - type: rca_ac_at_k
  - type: rca_component_match
  - type: rca_onset_within_tolerance
  - type: rca_abstention_correctness
  - type: rca_false_accusation_rate

# Every rule is advisory. These bounds are SOAK STARTING POINTS recorded in config, not
# spec thresholds — the spec delta carries no numeric threshold, and a blocking rule is a
# later, separate change that states the soak evidence it rests on. The 0.30 AC@1 floor
# sits in the region of the best independent full-benchmark result for this task family
# (12.5% strict / 22.4% partial); the baseline's measured per-cell accuracy lives in the
# corpus manifest (`baseline_strict_ac1`), which is where evidence-driven moves come from.
#
# `report_only` files each rule to the advisory channel instead of failing the gate
# (F-062) — the rule is evaluated on the identical path, so the soak reads real verdicts.
gate:
  rules:
    - { score: rca_ac_at_k, metric: mean, min: 0.30, report_only: true }
    - { score: rca_abstention_correctness, metric: mean, min: 0.80, report_only: true }
    # `max`, not `min`: this scorer is a false-accusation RATE, where lower is better.
    # The mean is corpus-wide, so the frozen unanswerable fraction (25%) bounds what
    # this number can be; the pass_rate reads the clean-decline rate over unanswerables.
    - { score: rca_false_accusation_rate, metric: mean, max: 0.20, report_only: true }

sinks:
  - type: console
    params: { verbose: true }
