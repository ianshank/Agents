# Requirements-generation evaluation (synthetic scope) — four deterministic scorers
# over a generated requirement set, with retrieval-evidence provenance recorded by the
# provenance_recorder target wrapper.
#
# Run:
#   eval-harness run --config config/requirements_eval.yaml
#
# The dataset ships with the repository: `corpora/requirements/v1/eval/train.jsonl` is
# the frozen synthetic corpus's TRAIN split (generated by
# `scripts/gen_requirements_corpus.py`; `--check` gates drift). Its sibling
# `holdout.jsonl` is sequestered — a separate file precisely so that iterating on scorers
# against this config cannot touch it. Point a config at the holdout deliberately, once,
# to confirm a scorer change generalises.
#
# The default target below composes the provenance recorder over an echo stand-in so the
# evidence-recording path runs offline; point `inner_spec` at a real generator to
# evaluate one. The store contents come from the corpus's captured evidence bytes.

schema_version: "1.0"

run:
  name: "requirements-eval"
  seed: 7

dataset:
  type: jsonl
  params:
    path: "corpora/requirements/v1/eval/train.jsonl"

target:
  type: provenance_recorder
  params:
    # `echo` surfaces the corpus's scripted stand-in generator output (`inputs.generated`)
    # so all four scorers run offline with no model call. The stand-in is DERIVED from the
    # gold set: its scores describe the stand-in and are not a measurement of any
    # generator. Point `inner_spec` at the system under test for a real evaluation; the
    # `generated` field then simply goes unread.
    inner_spec: { type: echo, params: { output_key: generated } }
    # Offline store: the wrapper fetches each item's declared evidence_sources from this
    # file, which the generator emits alongside the dataset. It serves the bytes CAPTURED
    # for each source, so the hashes this run records verify clean against it. Its sibling
    # `store.drifted.json` serves what a re-fetch would return after a post-capture edit;
    # re-running `verify_provenance` over these records against that store is what shows
    # the check detects drift rather than only recording a hash (validator F-068).
    # Read under DATA_ROOT confinement, like every other config-named dataset path.
    # `store_contents:` takes the same mapping inline for a small ad-hoc store.
    store_path: "corpora/requirements/v1/eval/store.json"

scorers:
  - type: req_ac_recall
  - type: req_scope_hallucination
  - type: req_traceability_closure
  - type: req_semantic_diversity

# Every rule is advisory. Bounds are soak starting points recorded in config, not spec
# thresholds — the spec delta carries no numeric threshold, and a blocking rule is a
# later, separate change that states the soak evidence it rests on.
#
# `report_only` is what makes that possible without disarming anything else: the rule is
# evaluated on the identical path and filed to the advisory channel instead of failing
# the gate (F-062). For req_semantic_diversity the advisory channel IS the escalation
# route the spec asks for: a sub-floor diversity score is a coverage risk requiring
# escalation, not a correctness failure, so it must never fail a run.
gate:
  rules:
    - { score: req_ac_recall, metric: mean, min: 0.70, report_only: true }
    # `max`, not `min`: this scorer is a hallucination RATE, where lower is better.
    - { score: req_scope_hallucination, metric: mean, max: 0.10, report_only: true }
    - { score: req_semantic_diversity, metric: mean, min: 0.35, report_only: true }
    - { score: req_traceability_closure, metric: mean, min: 0.60, report_only: true }

sinks:
  - type: console
    params: { verbose: true }
