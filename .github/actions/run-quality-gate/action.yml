name: Run quality gate
description: >-
  Set up Python and run a package's generated quality gate so CI executes the exact
  same checks as local `make check` (ADR 0020 design law / ADR 0021 delegation).
inputs:
  python-version:
    description: Python version to set up.
    required: true
  install:
    description: Shell command that installs the package and its dependencies.
    required: true
  check:
    description: Quality-gate command to run.
    required: false
    default: make check
  working-directory:
    description: Directory to run the install and check commands in.
    required: false
    default: "."
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
    # uv is on PATH for workspace `uv sync --locked` installs. Skills and other
    # callers that still `pip install` ignore it. setup-python stays first so uv
    # uses that interpreter rather than downloading another.
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      with:
        enable-cache: true
    - run: python -m pip install --upgrade pip "setuptools>=68"
      shell: bash
      working-directory: ${{ inputs.working-directory }}
    # `install` and `check` are static, workflow-authored strings (never external input); the
    # `install` string carries `&&`, which only works as a shell operator when interpolated
    # before bash parses the line — an `env:` + `$VAR` form would treat `&&` as a literal arg.
    - run: ${{ inputs.install }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
    # Workspace uv sync writes `.venv` at the repo root, not under a member
    # working-directory. Skills that pip-install have no such venv; skip then.
    - name: Prefer the uv workspace venv when present
      shell: bash
      run: |
        if [ -d "${GITHUB_WORKSPACE}/.venv/bin" ]; then
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"
        fi
    - run: ${{ inputs.check }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
