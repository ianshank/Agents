name: skills CI

on:
  push:
    branches: [main]
    # A single glob, not one entry per skill: `paths:` is workflow-scoped (no job carries
    # its own `if:`), so any listed skill already fans out every job in this file -- the
    # per-skill entries bought no selectivity, only the risk of omission. `dataset-lint` was
    # omitted this way for a full skills-ci.yml revision and its dedicated job silently never
    # ran on its own changes (fixed alongside the `all-skills` job below, F-050).
    paths:
      - "skills/**"
      - ".github/workflows/skills-ci.yml"
  pull_request:
    paths:
      - "skills/**"
      - ".github/workflows/skills-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skills-${{ github.ref }}
  cancel-in-progress: true

# Every per-skill job delegates to that skill's generated quality-gate.sh via the
# run-quality-gate composite action (ADR 0021): local == CI by construction. The
# gates are generated by skills/quality-gate (regenerate line in each file's
# header) plus a hand-maintained do_extra that runs the skill's validate_skill
# self-check. Skills are not pip-installable packages, so the action's `check`
# calls the gate script directly rather than `make` (ADR 0021 allows direct
# script execution where appropriate); the pinned ruff/mypy versions ride in each
# `install` string so skills lint/type identically to the repo root (F-055).

jobs:
  eval-corpus-forge:
    name: eval-corpus-forge py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-quality-gate
        with:
          python-version: ${{ matrix.python-version }}
          working-directory: skills/eval-corpus-forge
          install: pip install pytest pytest-cov "pyyaml>=6" "ruff==0.15.20" "mypy==2.1.0"
          check: ./scripts/quality-gate.sh all

  architecture-drift-guard:
    name: architecture-drift-guard py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-quality-gate
        with:
          python-version: ${{ matrix.python-version }}
          working-directory: skills/architecture-drift-guard
          # Isolated: only grimp + pyyaml + tooling — never the repo packages. The
          # skill must not import the code it polices. grimp is pinned for a
          # reproducible graph (an unpinned bump could shift edges and the gate).
          install: pip install pytest pytest-cov "pyyaml>=6" "ruff==0.15.20" "mypy==2.1.0" "grimp==3.14"
          check: ./scripts/quality-gate.sh all

  openai-judge:
    name: openai-judge py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-quality-gate
        with:
          python-version: ${{ matrix.python-version }}
          working-directory: skills/openai-judge
          # Isolated: the runner's --mock path and the unit tests (which inject a fake
          # eval_harness.judges) need no repo packages.
          install: pip install pytest pytest-cov "pyyaml>=6" "ruff==0.15.20" "mypy==2.1.0"
          check: ./scripts/quality-gate.sh all

  model-bench:
    name: model-bench py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-quality-gate
        with:
          python-version: ${{ matrix.python-version }}
          working-directory: skills/model-bench
          # Unlike the other skills, model-bench wraps the harness, so it installs the
          # repo packages (the eval engine + agent_core for the campaign's Wilson stats).
          # Paths stay relative to the working-directory (skills/model-bench).
          install: pip install pytest pytest-cov "ruff==0.15.20" "mypy==2.1.0" -e ../.. -e ../../agent-core
          check: ./scripts/quality-gate.sh all

  project-setup:
    name: project-setup py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-quality-gate
        with:
          python-version: ${{ matrix.python-version }}
          working-directory: skills/project-setup
          # tomli only on 3.10 (3.11+ has stdlib tomllib). No repo packages: the
          # generator only inspects files.
          install: pip install pytest pytest-cov "ruff==0.15.20" "mypy==2.1.0" "tomli; python_version < '3.11'"
          check: ./scripts/quality-gate.sh all

  quality-gate:
    name: quality-gate py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-quality-gate
        with:
          python-version: ${{ matrix.python-version }}
          working-directory: skills/quality-gate
          # The generated-gate execution tests shell out to bash + shellcheck, both
          # preinstalled on ubuntu-latest.
          install: pip install pytest pytest-cov "ruff==0.15.20" "mypy==2.1.0" "tomli; python_version < '3.11'"
          check: ./scripts/quality-gate.sh all

  deploy:
    name: deploy py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-quality-gate
        with:
          python-version: ${{ matrix.python-version }}
          working-directory: skills/deploy
          # No third-party runtime deps (config is flag-driven). bash + shellcheck are
          # preinstalled on ubuntu-latest, so the deploy-script safety-rail execution
          # tests run here.
          install: pip install pytest pytest-cov "ruff==0.15.20" "mypy==2.1.0"
          check: ./scripts/quality-gate.sh all

  dataset-lint:
    name: dataset-lint py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-quality-gate
        with:
          python-version: ${{ matrix.python-version }}
          working-directory: skills/dataset-lint
          install: pip install pytest pytest-cov "ruff==0.15.20" "mypy==2.1.0"
          check: ./scripts/quality-gate.sh all

  repo-invariant-review:
    name: repo-invariant-review py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false
          # The checker diffs against a base ref and reads the repo's own protected-path and
          # size-budget sources of truth, so it needs real history, not a shallow clone.
          fetch-depth: 0
      - uses: ./.github/actions/run-quality-gate
        with:
          python-version: ${{ matrix.python-version }}
          working-directory: skills/repo-invariant-review
          install: pip install pytest pytest-cov "ruff==0.15.20" "mypy==2.1.0"
          check: ./scripts/quality-gate.sh all

  common:
    name: common py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-quality-gate
        with:
          python-version: ${{ matrix.python-version }}
          working-directory: skills/common
          install: pip install pytest pytest-cov "pyyaml>=6" "ruff==0.15.20" "mypy==2.1.0"
          # skill_validator.py is the grading engine every other skill's vendored
          # validate_skill.py imports from. Its gate's coverage step uses --cov=. with
          # the skill's own .coveragerc (a bare --cov=skill_validator module name
          # silently measures 0% — pytest-cov resolves it against sys.modules after the
          # module is already cached). Its self-check is structural-only: common has no
          # evals/evals.json because it IS the grading engine, not a task producing
          # gradable output (ADR 0030's third case).
          check: ./scripts/quality-gate.sh all

  openspec-implementation-review:
    name: openspec-implementation-review py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-quality-gate
        with:
          python-version: ${{ matrix.python-version }}
          working-directory: skills/openspec-implementation-review
          # pyyaml is for the vendored validate_skill.py's real-YAML frontmatter parsing
          # path (same precedent as common/eval-corpus-forge/openai-judge).
          install: pip install pytest pytest-cov "pyyaml>=6" "ruff==0.15.20" "mypy==2.1.0"
          check: ./scripts/quality-gate.sh all

  pre-pr-gate:
    name: pre-pr-gate py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-quality-gate
        with:
          python-version: ${{ matrix.python-version }}
          working-directory: skills/pre-pr-gate
          # No third-party runtime deps -- run_pre_pr_gate.py only shells out to `make`.
          install: pip install pytest pytest-cov "ruff==0.15.20" "mypy==2.1.0"
          check: ./scripts/quality-gate.sh all

  # Repo-level guard over the skill *set*, not a per-skill quality gate (ADR 0030) -- it sits
  # outside the ADR 0021 delegation chain by design, so its steps run inline rather than
  # through a generated quality-gate.sh. Gives every skills/*/ directory a structural floor,
  # not just the 8 with a dedicated job above (F-050).
  all-skills:
    name: all-skills structural + registry + drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      # jsonschema is NOT optional here: skill_marketplace.py's validate_schema() catches
      # ImportError and only *warns* before returning 0 -- a lean install would silently
      # no-op the registry schema check while the step still reported success.
      - run: pip install "pyyaml>=6" "jsonschema>=4.0"
      # Structural tier for every skill directory, dynamically discovered (skills/*/, never
      # an allowlist -- a new skill is covered the day it lands). Accumulates failures
      # instead of short-circuiting so one bad skill can't hide a second.
      - name: Structural validation for every skill
        run: |
          rc=0
          for d in skills/*/; do
            python scripts/validate_skill.py --skill "$d" --tier structural || rc=1
          done
          exit $rc
      - name: Marketplace registry validation
        run: python scripts/skill_marketplace.py validate
      # Vendored validate_skill.py copies must stay byte-identical to their canonical
      # source. This job is what makes the guard reachable on every skill's own changes --
      # previously only the 8 skills with a dedicated job below triggered any check at all.
      - name: Skill-script drift guard
        run: python scripts/check_skill_script_drift.py
      # Shared skill-validator module coverage (>= 95%). Runs directly in root since
      # skill_validator.py is shared, unvendored infrastructure (unlike the per-skill
      # validate_skill.py wrappers).
      - name: Skill validator coverage (>=95%)
        run: >-
          pip install pytest pytest-cov &&
          python -m pytest skills/common/tests/test_skill_validator.py
          --cov=common.skill_validator --cov-branch
          --cov-report=term-missing --cov-fail-under=95
      # Every skills/*/ directory must be registered in marketplace.yaml, and must have
      # either a dedicated job in this file or a documented EXEMPT entry. Structured on the
      # docs.yml component-README guard: a derived list plus a dict[name, reason] EXEMPT, not
      # a bare set. Inline (not scripts/*.py) so it stays out of the scripts/ coverage floor
      # (F-031) and the protected tests/** guard.
      - name: Every skill is registered and CI-covered
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import sys

          import yaml

          ROOT = pathlib.Path(".")

          # Skills exempt from a dedicated lint/type/pytest job: the template's own
          # "Subjective skills" class (docs/SKILL_TEMPLATE.md Sec.5.B) -- structural tier +
          # marketplace registration + drift guard is their complete CI contract (ADR 0030).
          # Each reason is re-checked below against evals/evals.json so a skill that later
          # grows real evals and library code can't stay silently exempted forever.
          EXEMPT = {
              "hierarchical-recursive-brainstorm": "subjective skill (SKILL_TEMPLATE.md Sec.5.B); no evals/",
              "openspec-quality-plan": "subjective skill (SKILL_TEMPLATE.md Sec.5.B); no evals/",
              "openspec-peer-review": "subjective skill (SKILL_TEMPLATE.md Sec.5.B); no evals/",
          }

          marketplace = yaml.safe_load((ROOT / "skills" / "marketplace.yaml").read_text())
          registered = {s["name"] for s in marketplace.get("skills", [])}

          workflow = yaml.safe_load((ROOT / ".github" / "workflows" / "skills-ci.yml").read_text())
          job_names = set(workflow["jobs"].keys())

          skill_dirs = sorted(p.name for p in (ROOT / "skills").iterdir() if p.is_dir())
          if not skill_dirs:
              print("skill-coverage: FAIL - no skill directories discovered under skills/")
              sys.exit(1)

          errors = []
          for name in skill_dirs:
              if name not in registered:
                  errors.append(f"{name}: not registered in skills/marketplace.yaml")
              if name not in job_names and name not in EXEMPT:
                  errors.append(
                      f"{name}: no dedicated job in skills-ci.yml and not in EXEMPT "
                      "(add a job, or add a documented EXEMPT entry -- see ADR 0030)"
                  )

          for name, reason in EXEMPT.items():
              evals = ROOT / "skills" / name / "evals" / "evals.json"
              if evals.is_file():
                  errors.append(
                      f"{name}: EXEMPT reason ({reason!r}) is stale -- evals/evals.json now "
                      "exists; give it a dedicated job or reclassify per ADR 0030"
                  )

          if errors:
              print(f"skill-coverage: FAIL - {len(errors)} issue(s):")
              for e in errors:
                  print(f"  - {e}")
              sys.exit(1)
          print(f"skill-coverage: OK - {len(skill_dirs)} skill(s) registered and CI-covered.")
          PY
