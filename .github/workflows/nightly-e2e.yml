name: nightly-e2e

on:
  schedule:
    - cron: "0 4 * * *"  # 04:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e-matrix:
    name: e2e py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      HYPOTHESIS_PROFILE: ci
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Upgrade build tools
        run: python -m pip install --upgrade pip "setuptools>=68" wheel

      - name: Install monorepo dependencies
        run: |
          pip install -e "./agent-core[dev]"
          pip install -e "./flow-protocol[dev]"
          pip install -e "./flow-corpus[dev]"
          pip install -e "./behavioral-regression[dev]"
          pip install -e ".[dev,langfuse,openai,parquet,autoevals,e2e-matrix]"

      - name: Invariant & architectural integrity check
        run: |
          python scripts/check_charter_invariants.py
          python scripts/check_charter_drift.py

      - name: Full monorepo pytest suite
        run: |
          pytest tests/ -v --tb=short
          pytest agent-core/tests/ -v --tb=short
          pytest behavioral-regression/tests/ -v --tb=short
          pytest flow-corpus/tests/ -v --tb=short
          pytest flow-protocol/tests/ -v --tb=short

      - name: Verify e2e matrix artifact freshness
        run: python tests/test_e2e_matrix.py --check
