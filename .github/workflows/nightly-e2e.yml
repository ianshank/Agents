name: nightly-e2e

on:
  schedule:
    - cron: "0 4 * * *"  # 04:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e-matrix:
    name: e2e py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      HYPOTHESIS_PROFILE: ci
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb  # v6.1.0
        with:
          enable-cache: true
      - name: Install from the workspace lockfile
        run: >-
          uv sync --locked --all-packages --extra dev --extra langfuse --extra openai
          --extra parquet --extra autoevals --extra e2e-matrix --extra archguard
      - name: Prefer the uv workspace venv
        run: echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"

      # Scheduled coverage for the structural guards that otherwise only run per-PR:
      # a drift introduced by a merge sequence (two individually-green PRs) surfaces
      # here within a day instead of at the next release. jsonschema (registry schema)
      # and grimp (architecture drift) are in the install set above.
      - name: Invariant & architectural integrity check
        run: |
          python scripts/check_charter_invariants.py
          python scripts/check_charter_drift.py
          python scripts/check_size_budget.py
          python scripts/check_guard_reachability.py
          python scripts/check_coverage_floors.py
          python scripts/skill_marketplace.py validate
          python skills/architecture-drift-guard/scripts/drift_check.py --manifest architecture.yaml
          python skills/architecture-drift-guard/scripts/mermaid_gen.py --manifest architecture.yaml --check -o architecture.mmd

      - name: Full monorepo pytest suite
        run: |
          pytest tests/ -v --tb=short
          pytest agent-core/tests/ -v --tb=short
          pytest behavioral-regression/tests/ -v --tb=short
          pytest flow-corpus/tests/ -v --tb=short
          pytest flow-protocol/tests/ -v --tb=short

  # Freshness of the committed e2e-matrix artifact against a REAL run. This is a
  # separate single-version job, not a matrix leg: per-suite test counts and
  # coverage percentages legitimately differ across Python versions, and the
  # committed artifact is generated from one canonical environment (this one).
  # The Duration (ms) column is masked in the comparison (tests/_e2e_matrix.py
  # VOLATILE_COLUMNS) — wall-clock duration can never reproduce across machines.
  e2e-freshness:
    name: e2e-matrix freshness (offline driver)
    runs-on: ubuntu-latest
    env:
      HYPOTHESIS_PROFILE: ci
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"  # the canonical generation environment
          cache: "pip"

      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb  # v6.1.0
        with:
          enable-cache: true
      # archguard pulls grimp (pinned): F-009's dogfood and F-011's airgap
      # negative test shell out to drift_check.py, which needs grimp to build
      # the import graph. run_all_e2e.sh always invokes those (and
      # skills/architecture-drift-guard/tests/test_end_to_end.py). Omitting the
      # extra made the driver FAIL 2 and skipped the freshness --check — the
      # same install-line skew quality-gates.yml documents on its uv sync.
      - name: Install from the workspace lockfile
        run: >-
          uv sync --locked --all-packages --extra dev --extra langfuse --extra openai
          --extra parquet --extra autoevals --extra e2e-matrix --extra archguard
      - name: Prefer the uv workspace venv
        run: echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"

      - name: Run the POSIX e2e driver (offline tiers)
        run: bash scripts/run_all_e2e.sh --tiers offline --hypothesis-profile ci

      - name: e2e-matrix freshness check
        run: python tests/test_e2e_matrix.py --check

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: e2e-report
          path: artifacts/e2e-report/
          if-no-files-found: ignore
