# Credential scanning, on EVERY pull request and every push to main.
#
# WHY THIS IS ITS OWN WORKFLOW
# This job used to live in `quality-gates.yml`, which carries a `paths:` filter. GitHub
# evaluates `paths:` per WORKFLOW, not per job, so a pull request touching only paths that
# filter does not list -- `docs/`, `demos/`, `skills/`, a corpus, a README -- never started
# the workflow, and therefore never ran gitleaks. Worse than merely skipping it: the
# companion stub in `required-check-stubs.yml` then reported the `secret scan (gitleaks)`
# context GREEN, so the pull request displayed a passing secret scan that no scanner had
# produced. A green check nobody earned is worse than a missing one.
#
# A credential can be committed in ANY file, so the correct filter for this job is no
# filter. It is cheap (one pinned binary, two passes) and unconditional, which also means
# it never deadlocks a required check and needs no stub -- the stub for it was removed in
# the same change that created this file.
#
# The job `name:` below is byte-identical to the one it replaces, so the required status
# check context is unchanged and no branch-protection setting has to move.
name: secret scan

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false
          fetch-depth: 0  # the history scan needs full history
      - name: Install gitleaks (pinned; bump the version here to upgrade)
        run: |
          VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks version
      # Fail-closed on the working tree: any secret in the CURRENT files fails the job.
      - name: gitleaks -- working tree (fail-closed)
        run: ./gitleaks detect --no-git --source . --config .gitleaks.toml --redact --verbose
      # Report-only over history: the known Langfuse finding is deliberately not rewritten
      # out of history (ADR 0027); --exit-code 0 keeps this informational.
      - name: gitleaks -- git history (report-only, ADR 0027)
        run: ./gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 0
