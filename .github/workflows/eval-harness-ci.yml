name: eval-harness CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/eval-harness-ci.yml"
      - ".github/actions/run-quality-gate/**"
      - "scripts/**"
      - "config/**"
      # `src/eval_harness` imports `agent_core` directly (58 import sites across
      # src/tests/scripts — e.g. `campaign.py` -> `wilson_interval`,
      # `agent_core_adapter/calibration.py` -> `cohen_kappa`), which is why the job below
      # installs `./agent-core` before running the gate. Without this entry a signature
      # change in agent-core merged green and broke this suite on main.
      - "agent-core/**"
      - "features.yaml"
      - "architecture.yaml"
      - "CHANGELOG.md"
      # The generated coverage artifact: a hand edit to it alone must still run the
      # suite so tests/test_matrix_coverage.py's freshness gate can go red (F-053).
      - "docs/matrix-coverage.md"
      # The evaluation DATA. `tests/test_testgen_corpus.py` re-derives the committed corpus
      # and fails if a byte differs, and `config/testgen_eval.yaml` reads
      # `corpora/testgen/v1/eval/` as its dataset — so a corpus-only change is an
      # eval-integrity change. Without this entry it ran no workflow at all, while every
      # required-check stub reported green.
      - "corpora/**"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/eval-harness-ci.yml"
      - ".github/actions/run-quality-gate/**"
      - "scripts/**"
      - "config/**"
      # See the push-paths note above: eval_harness depends on agent_core, so an
      # agent-core-only PR must re-run this suite.
      - "agent-core/**"
      - "features.yaml"
      - "architecture.yaml"
      - "CHANGELOG.md"
      # See the push-paths note: freshness gate reachability for the generated doc.
      - "docs/matrix-coverage.md"
      # See the push-paths note: the corpus is evaluation data, not a fixture.
      - "corpora/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Namespaced. Three workflows used to declare the bare name `py<version>`, so all three
    # published the identical check contexts `py3.11`/`py3.12`/`py3.13`. Branch protection
    # matches required checks by context string, so a PR touching only `claude-foundation/`
    # could satisfy a requirement meant for this suite with a green check this workflow
    # never produced (ADR 0040). Any new matrix job must carry its own prefix.
    name: eval-harness py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false
      # Delegate to the generated root gate so CI runs the exact same steps as local
      # `make check` -> ./scripts/quality-gate.sh all (ADR 0021 — CI gate delegation, POC).
      # This subsumes the previous inline ruff/format/mypy/pytest steps and the operational-
      # scripts coverage gate (the gate's do_extra runs the scripts pytest). autoevals stays
      # in the install: it is lightweight (no numpy/pandas) and offline-safe, so the autoevals
      # scorer bridge keeps real coverage; `braintrust` is deliberately absent (its sink
      # degrades to a no-op when absent, mirroring phoenix).
      - uses: ./.github/actions/run-quality-gate
        env:
          # Wider property-test search on CI, no per-example deadline (noisy runners).
          # Same convention as the four sibling package workflows.
          HYPOTHESIS_PROFILE: ci
        with:
          python-version: ${{ matrix.python-version }}
          install: pip install -e "./agent-core" && pip install -e ".[dev,langfuse,openai,parquet,autoevals]"
          check: make check
