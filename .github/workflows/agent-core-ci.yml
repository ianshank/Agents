name: agent-core CI

on:
  push:
    branches: [main]
    paths:
      - "agent-core/**"
      - "uv.lock"
      - ".github/workflows/agent-core-ci.yml"
      - ".github/actions/run-quality-gate/**"
  pull_request:
    paths:
      - "agent-core/**"
      - "uv.lock"
      - ".github/workflows/agent-core-ci.yml"
      - ".github/actions/run-quality-gate/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Namespaced -- see ADR 0040. The bare `py<version>` name collided with
    # eval-harness-ci.yml and claude-foundation-ci.yml on the same check contexts.
    name: agent-core py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false
      # Delegate to the generated package gate so CI runs the exact same steps as local
      # `make -C agent-core check` -> agent-core/scripts/quality-gate.sh all (ADR 0021).
      - uses: ./.github/actions/run-quality-gate
        with:
          python-version: ${{ matrix.python-version }}
          working-directory: agent-core
          install: uv sync --locked --package agent-core --extra dev
          check: make check
