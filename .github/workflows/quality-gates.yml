name: quality gates

on:
  push:
    branches: [main]
    paths:
      - "features.yaml"
      - "scripts/validations/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      # `.github/**` is a PROTECTED_PATTERN (scripts/eval_protected_paths.py), but this
      # filter used to match only this file — so a workflow- or action-only PR skipped the
      # protected-path guard AND the feature validators entirely. PR #64 merged through that
      # gap and left F-031/F-037 red on main, undetected. CI workflows are exactly where a
      # gate threshold gets weakened, so they must run the guard like any other eval surface.
      - ".github/workflows/**"
      - ".github/actions/**"
  pull_request:
    # 'labeled'/'unlabeled' so adding the eval-change-approved label re-runs the
    # protected-path guard and clears the check (default types don't fire on labels).
    types: [opened, synchronize, reopened, labeled, unlabeled]
    # Every entry in scripts/eval_protected_paths.py::PROTECTED_PATTERNS must be covered
    # here, or a PR touching only that path runs no protected-path check and the guard is
    # protection in name only. That agreement is asserted by
    # scripts/check_guard_reachability.py (F-052) and fails CI if either list drifts —
    # do not edit one without the other.
    paths:
      - "features.yaml"
      - "features.schema.json"
      - "scripts/validations/**"
      - "scripts/**"
      - "config/**"
      - "src/**"
      - "tests/**"
      # The four sibling packages plus the claude-foundation staging tree each carry their
      # own protected tests/ root; none were reachable before F-052.
      - "agent-core/tests/**"
      - "behavioral-regression/tests/**"
      - "flow-corpus/tests/**"
      - "flow-protocol/tests/**"
      - "claude-foundation/tests/**"
      - "pyproject.toml"
      # Broadened from workflows/ + actions/ to all of .github/**: CODEOWNERS is what makes
      # the label gate meaningful, and it sat outside both narrower prefixes.
      - ".github/**"
      # The architecture manifest is the airgap's enforcement surface — editing its declared
      # component edges could quietly let the corpus and harness import each other.
      - "architecture.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: feature-validate + regression-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
          fetch-depth: 0  # regression gate needs history to materialise the baseline
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      # Merge-conflict-marker guard: an orphan `>>>>>>> origin/main` landed in NEXT_STEPS.md,
      # AGENTS.md, and CHANGELOG.md (x2) via an unclean merge in a prior PR, undetected because
      # nothing checked for it. Inline (not scripts/*.py) for the same reason as docs.yml's
      # doc-structure guard: stays out of the scripts/ coverage floor (F-031) and the protected
      # tests/** guard. Runs first (no install needed) so a marker fails fast, before the
      # slower steps below install dependencies. Sweeps every git-tracked file dynamically
      # (not an allowlist), so a marker in a NEW file is caught too. Matches all four 2-way/
      # diff3 marker forms, including a bare/orphan trailer with nothing on the other side —
      # exactly the shape that slipped through here.
      - name: Merge-conflict marker guard
        shell: bash
        run: |
          python - <<'PY'
          import re, subprocess, sys

          MARKER = re.compile(r"^(<{7}( .*)?$|={7}$|>{7}( .*)?$|\|{7}( .*)?$)")
          out = subprocess.run(["git", "ls-files", "-z"], capture_output=True, check=True).stdout
          files = [f.decode("utf-8", errors="surrogateescape") for f in out.split(b"\0") if f]

          fail = []
          for path in files:
              try:
                  with open(path, encoding="utf-8") as fh:
                      for lineno, line in enumerate(fh, start=1):
                          if MARKER.match(line.rstrip("\n")):
                              fail.append(f"{path}:{lineno}: {line.rstrip()!r}")
              except (UnicodeDecodeError, OSError):
                  continue  # binary or unreadable; not a text merge-marker candidate

          if fail:
              print("MERGE-CONFLICT MARKER GUARD FAILURES:")
              for x in fail:
                  print("  -", x)
              sys.exit(1)
          print(f"merge-conflict marker guard OK; {len(files)} tracked file(s) checked")
          PY
      - run: python -m pip install --upgrade pip "setuptools>=68"
      - run: pip install -e "./agent-core"
      # archguard pulls grimp (pinned): F-011's airgap negative test shells out to
      # drift_check.py, which needs grimp to build the import graph. (F-011..F-015 add
      # flow-protocol/flow-corpus to sys.path themselves, so no editable install needed.)
      # e2e-matrix pulls openpyxl (pinned, no numpy/pandas): the "E2E-matrix generator
      # coverage" step further below measures tests._e2e_matrix_xlsx, whose writer would
      # otherwise importorskip and report as uncovered -- the vacuous-coverage shape this
      # repo already fixed once for parquet.
      - run: pip install -e ".[dev,langfuse,openai,archguard,parquet,e2e-matrix]"
      # Feature ledger: schema + DAG + git provenance + tier-fast validation commands.
      # --strict makes an unresolvable `implemented_in` an ERROR, not a warning. Without it
      # the provenance check was decorative: 6 SHAs from squash-merged branches had rotted
      # away and 6 entries carried the literal placeholder "local", all reported as warnings
      # nobody read. Safe to enforce because `implemented_in` is optional — only a *present
      # but unresolvable* ref fails, and the checkout above uses fetch-depth: 0, which is what
      # the refs need. (On a shallow clone the script downgrades itself back to warnings; see
      # _check_git_refs. Squash-merging a PR would rot its own ref, so keep merge commits.)
      - run: python scripts/validate.py --tier fast --strict
      # Vendored skill-script copies must stay byte-identical to their canonical source.
      - name: Skill-script drift guard
        run: python scripts/check_skill_script_drift.py
      # Structural size budget: no source file over 500 lines (hard gate). Function-length
      # and public-method-count overages print as non-blocking warnings (ADR 0019).
      - name: Source-file size budget
        run: python scripts/check_size_budget.py
      # Guard-reachability gate: a protected path the guard never fires on is not
      # protected. Asserts every PROTECTED_PATTERNS entry is covered by this workflow's own
      # pull_request paths: filter — the two lists had drifted to 9 of 15 unreachable,
      # including architecture.yaml, the airgap's own enforcement surface (F-052).
      - name: Protected-path guard reachability
        run: python scripts/check_guard_reachability.py
      # Charter-drift guard: every markdown reference in docs/CHARTER.md resolves to a
      # real repo file/ADR (also enforced via the full test suite; this is the first-class
      # gate signal, mirroring the sibling guards above).
      - name: Charter drift guard
        run: python scripts/check_charter_drift.py
      # Charter-invariants guard: re-checks the charter's claims (package roles, zero-dep
      # agent-core, SCHEMA_VERSION single-sourcing, coverage floors, Protocol-based DI,
      # default-off flags, ...) against the actual code — a mechanical superset of the
      # link-only drift guard above, added after docs/CHARTER_ALIGNMENT_AUDIT.md found
      # drift that check_charter_drift.py could not have caught.
      - name: Charter invariants guard
        run: python scripts/check_charter_invariants.py
      # Coverage gate for the quality-gate tooling itself (separate from the library's
      # eval_harness coverage, since scripts/ is omitted from that config).
      - name: Quality-gate tooling coverage (>=85%)
        run: >-
          python -m pytest
          tests/test_regression_gate.py tests/test_protected_paths.py tests/test_fix_loop.py
          tests/test_skill_script_drift.py tests/test_cli_logging.py
          tests/test_skill_marketplace.py tests/test_validation_scripts.py
          tests/test_merge_gate_context.py tests/test_record_audit_verdict.py
          tests/test_audit_issue_sync.py tests/test_check_size_budget.py
          tests/test_check_charter_drift.py tests/test_check_charter_invariants.py
          tests/test_check_guard_reachability.py tests/test_matrix_coverage.py
          --override-ini addopts=""
          --cov=regression_gate --cov=eval_protected_paths
          --cov=check_protected_changes --cov=fix_loop
          --cov=check_skill_script_drift --cov=_cli --cov=check_size_budget
          --cov=check_charter_drift --cov=check_charter_invariants
          --cov=check_guard_reachability
          --cov=skill_marketplace --cov=_common
          --cov=F_020 --cov=F_021 --cov=F_022 --cov=F_023
          --cov=merge_gate_context --cov=record_audit_verdict --cov=audit_issue_sync
          --cov=F_031 --cov=F_032 --cov=F_033 --cov=F_034 --cov=F_035 --cov=F_037
          --cov=F_039 --cov=F_041 --cov=F_045 --cov=F_050 --cov=F_052 --cov=F_053
          --cov=F_054 --cov=F_055
          --cov=tests._matrix_coverage
          --cov-branch --cov-config=/dev/null --cov-report=term-missing --cov-fail-under=85
      # Dedicated floor for the e2e-matrix generator. Deliberately its own step: folded into
      # the aggregate above it would sit among ~40 modules, where a regression in it is
      # absorbed by everything else's headroom. Runs in about a second.
      - name: E2E-matrix generator coverage (>=97%)
        run: >-
          python -m pytest tests/test_e2e_matrix.py
          --override-ini addopts=""
          --cov=tests._e2e_matrix --cov=tests._e2e_matrix_xlsx
          --cov-branch --cov-config=/dev/null --cov-report=term-missing --cov-fail-under=97
      # Net-new lint/test regressions vs the PR base (or main on push). Blocks on net-new.
      - name: Regression gate
        run: >-
          python scripts/regression_gate.py
          --base-ref "origin/${{ github.base_ref || 'main' }}"
          --report-path regression_report.json
      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: regression-report
          path: regression_report.json
          if-no-files-found: ignore

  eval-integrity:
    name: protected-path guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_REF: origin/${{ github.base_ref }}
      PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      # Pure-stdlib guard; no install needed. Flags eval-defining changes lacking approval.
      - run: python scripts/check_protected_changes.py

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
          fetch-depth: 0  # the history scan needs full history
      - name: Install gitleaks (pinned; bump the version here to upgrade)
        run: |
          VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks version
      # Fail-closed on the working tree: any secret in the CURRENT files fails the job.
      - name: gitleaks -- working tree (fail-closed)
        run: ./gitleaks detect --no-git --source . --config .gitleaks.toml --redact --verbose
      # Report-only over history: the known Langfuse finding is deliberately not rewritten
      # out of history (ADR 0027); --exit-code 0 keeps this informational.
      - name: gitleaks -- git history (report-only, ADR 0027)
        run: ./gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 0
