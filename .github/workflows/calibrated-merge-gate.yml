name: calibrated merge gate

# Default-OFF (see ADR 0005). Auto-merge happens ONLY when the repo variable
# ENABLE_CALIBRATED_AUTOMERGE == 'true' AND a populated outcome store exists.
# With no store every domain cold-starts to ESCALATE, so this workflow is inert
# until a human enables it and audit data accumulates.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: merge-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: calibrated merge decision
    # Inert by default: the job only runs once a human enables the gate (ADR 0005).
    # It is wired to parity with the shadow job below — same store, same context
    # composition, same decision entry point — so enabling the variable flips
    # visibility, not behaviour. Before this parity wiring the job decided on
    # argparse defaults (mech_pass=False), which decide() maps to REJECT: flipping
    # the variable would have failed every PR regardless of the store's contents.
    if: ${{ vars.ENABLE_CALIBRATED_AUTOMERGE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30  # the regression gate runs the root suite in both trees
    env:
      # Empty GitHub `vars` stay inert: overlay_from_environ skips blank values
      # so dataclass defaults remain until a human sets a repo variable (I-4).
      MERGE_GATE_RISK_TARGET: ${{ vars.MERGE_GATE_RISK_TARGET }}
      MERGE_GATE_RISK_CI_Z: ${{ vars.MERGE_GATE_RISK_CI_Z }}
      MERGE_GATE_MIN_CALIBRATION_N: ${{ vars.MERGE_GATE_MIN_CALIBRATION_N }}
      MERGE_GATE_MAX_ECE: ${{ vars.MERGE_GATE_MAX_ECE }}
      MERGE_GATE_MIN_AUROC: ${{ vars.MERGE_GATE_MIN_AUROC }}
      MERGE_GATE_MAX_BIN_CI_WIDTH: ${{ vars.MERGE_GATE_MAX_BIN_CI_WIDTH }}
      MERGE_GATE_N_BINS: ${{ vars.MERGE_GATE_N_BINS }}
      MERGE_GATE_WILSON_FLOOR: ${{ vars.MERGE_GATE_WILSON_FLOOR }}
      MERGE_GATE_WILSON_Z: ${{ vars.MERGE_GATE_WILSON_Z }}
      # Paths in MERGE_GATE_POLICY_FILE are cwd-relative. This job's defaults
      # set working-directory to agent-core; the shadow job below uses repo root.
      MERGE_GATE_POLICY_FILE: ${{ vars.MERGE_GATE_POLICY_FILE }}
      AGENT_CORE_LOG_LEVEL: ${{ vars.AGENT_CORE_LOG_LEVEL }}
    defaults:
      run:
        working-directory: agent-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          fetch-depth: 0  # base diff + regression-gate baseline worktree
          # Credentials persist so the read-only store pull can FETCH the data
          # branch on a private repo (same posture as the shadow job; the
          # workflow-level contents: read keeps the persisted token write-proof).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip "setuptools>=68"
      - run: pip install -e .
      # regression_gate runs the offline ROOT suite in both trees; it needs the
      # same extras quality-gates installs (mirrors the shadow job's install).
      - run: pip install -e ".[dev,langfuse,openai,archguard,parquet,e2e-matrix,autoevals]"
        working-directory: ${{ github.workspace }}
      # Read-only pull; this workflow NEVER pushes the store (F-035). A failed
      # pull degrades to a cold start, which decide() maps to ESCALATE.
      - name: Sync store (read-only pull; tolerate failure -> cold start)
        working-directory: ${{ github.workspace }}
        env:
          STORE: ${{ vars.MERGE_GATE_STORE || 'merge_outcomes.jsonl' }}
        run: |
          set +e
          python -m agent_core.store_sync pull --store "$STORE" --repo-dir .
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::store pull rc=$rc — deciding over an empty store (cold start)"
          fi
          exit 0
      - name: Changed files vs base
        working-directory: ${{ github.workspace }}
        env:
          BASE: ${{ github.base_ref || 'main' }}
        run: |
          git diff --name-only "origin/$BASE...HEAD" > changed_files.txt
          cat changed_files.txt
      # mech_pass is computed honestly but not wastefully (same skip rule as
      # shadow): if the PR touches none of the measured paths, baseline ==
      # worktree on the measured surface and the gate trivially passes. rc 1
      # (net-new findings) and rc 2 (config error) both map to --no-mech-pass:
      # an unknown mechanical state is a failure (fail-safe).
      - name: Mechanical result (regression gate, skipped when unaffected)
        id: mech
        working-directory: ${{ github.workspace }}
        env:
          BASE: ${{ github.base_ref || 'main' }}
        run: |
          set +e
          if grep -qE '^(src/|tests/|scripts/|pyproject\.toml$)' changed_files.txt; then
            python scripts/regression_gate.py \
              --base-ref "origin/$BASE" \
              --report-path regression_report.json
            echo "rc=$?" >> "$GITHUB_OUTPUT"
          else
            echo "regression gate skipped: no measured path touched (equivalent to pass)"
            echo "rc=0" >> "$GITHUB_OUTPUT"
          fi
          exit 0
      # Context composition runs at repo root: config/merge-gate-domains.yaml is
      # cwd-relative. The optional flag is a bash array (F-047 idiom): an
      # unquoted $MECH_FLAG would word-split, and argparse is last-wins.
      - name: Compose change context
        working-directory: ${{ github.workspace }}
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
          MECH_RC: ${{ steps.mech.outputs.rc }}
        run: |
          MECH_ARGS=(--no-mech-pass)
          [ "$MECH_RC" = "0" ] && MECH_ARGS=(--mech-pass)
          python scripts/merge_gate_context.py "${MECH_ARGS[@]}" --output context.json
          cat context.json
      - name: Decide
        id: decide
        env:
          STORE: ${{ vars.MERGE_GATE_STORE || 'merge_outcomes.jsonl' }}
        run: |
          set +e
          # STORE is repo-root-relative (the pull above ran at the workspace
          # root); this step's cwd stays agent-core for MERGE_GATE_POLICY_FILE.
          case "$STORE" in
            /*) STORE_PATH="$STORE" ;;
            *) STORE_PATH="$GITHUB_WORKSPACE/$STORE" ;;
          esac
          python -m agent_core.merge_gate_ci --store "$STORE_PATH" \
            --context "$GITHUB_WORKSPACE/context.json" \
            --audit-log "$GITHUB_WORKSPACE/merge_decisions.jsonl"
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # Exit-code contract: 0 AUTO_MERGE, 10 ESCALATE, 20 REJECT,
          # 2 usage error, 1 unexpected internal error. Only the two non-failing
          # decisions (AUTO_MERGE / ESCALATE) pass the gate; REJECT *and* any
          # error code fail it, so an internal or usage error can never be
          # mistaken for success and silently bypass the gate.
          case "$rc" in
            0 | 10) exit 0 ;;
            *) exit 1 ;;
          esac
      # The acting decision's audit trail must outlive the runner: unlike
      # shadow's, this record is what a merge was authorized from.
      - name: Upload decision audit log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: merge-decisions
          path: merge_decisions.jsonl
          if-no-files-found: ignore
      - name: Auto-merge (gated, default-off)
        if: steps.decide.outputs.rc == '0' && vars.ENABLE_CALIBRATED_AUTOMERGE == 'true'
        run: echo "AUTO_MERGE — enabling merge would happen here (human-enabled)."
        # Real seam (NOT this change): GH_TOKEN + `gh pr merge --auto` requires
        # elevating the workflow to contents: write — that belongs to the
        # dedicated human-authored activation change (ADR 0005 checklist).

  # F-035 shadow mode (ADR 0005 soak, ADR 0018 persistence): a log-only
  # decision on EVERY PR. It cannot merge, approve, or block — all three
  # decision exit codes (0 AUTO_MERGE / 10 ESCALATE / 20 REJECT) map to job
  # success; only internal/usage errors (1/2) fail. Store sync here is
  # READ-ONLY (pull; never push): pull_request tokens are read-only for fork
  # PRs and a PR-time job has nothing legitimate to persist.
  shadow:
    name: shadow merge-gate decision (log-only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # Same repo-variable seam the acting gate job honors (I-4).
      STORE: ${{ vars.MERGE_GATE_STORE || 'merge_outcomes.jsonl' }}
      MERGE_GATE_RISK_TARGET: ${{ vars.MERGE_GATE_RISK_TARGET }}
      MERGE_GATE_RISK_CI_Z: ${{ vars.MERGE_GATE_RISK_CI_Z }}
      MERGE_GATE_MIN_CALIBRATION_N: ${{ vars.MERGE_GATE_MIN_CALIBRATION_N }}
      MERGE_GATE_MAX_ECE: ${{ vars.MERGE_GATE_MAX_ECE }}
      MERGE_GATE_MIN_AUROC: ${{ vars.MERGE_GATE_MIN_AUROC }}
      MERGE_GATE_MAX_BIN_CI_WIDTH: ${{ vars.MERGE_GATE_MAX_BIN_CI_WIDTH }}
      MERGE_GATE_N_BINS: ${{ vars.MERGE_GATE_N_BINS }}
      MERGE_GATE_WILSON_FLOOR: ${{ vars.MERGE_GATE_WILSON_FLOOR }}
      MERGE_GATE_WILSON_Z: ${{ vars.MERGE_GATE_WILSON_Z }}
      MERGE_GATE_POLICY_FILE: ${{ vars.MERGE_GATE_POLICY_FILE }}
      AGENT_CORE_LOG_LEVEL: ${{ vars.AGENT_CORE_LOG_LEVEL }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Credentials persist so the read-only store pull can FETCH the data
      # branch on a private repo (an unauthenticated fetch would make every
      # shadow decision cold-start over an empty store). permissions are
      # contents: read, so the persisted token still cannot push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          fetch-depth: 0  # base diff + regression-gate baseline worktree
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip "setuptools>=68"
      - run: pip install -e "./agent-core"
      # regression_gate runs the offline ROOT suite in both trees; it needs the
      # same extras quality-gates installs (dev alone cannot collect the suite).
      # `e2e-matrix` was missing while this comment claimed parity, so the two
      # `importorskip("openpyxl")` tests in tests/test_e2e_matrix.py were silently
      # skipped here -- consistently in both trees, so the regression gate saw no
      # net-new finding and reported a clean comparison over a smaller suite than
      # the one it names.
      - run: pip install -e ".[dev,langfuse,openai,archguard,parquet,e2e-matrix,autoevals]"
      - name: Sync store (read-only pull; tolerate failure -> cold start)
        run: |
          set +e
          python -m agent_core.store_sync pull --store "$STORE" --repo-dir .
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::store pull rc=$rc — deciding over an empty store (cold start)"
          fi
          exit 0
      - name: Changed files vs base
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed_files.txt
          cat changed_files.txt
      # mech_pass is computed honestly but not wastefully: the regression gate
      # measures only src/tests (lint) + tests/ (pytest). If the PR touches
      # none of those (nor scripts/ or pyproject.toml, which can change what
      # they mean), baseline == worktree on the measured surface and the gate
      # trivially passes — skipping it and asserting pass is equivalent.
      # rc 1 (net-new findings) and rc 2 (config error) both map to
      # --no-mech-pass: an unknown mechanical state is a failure (fail-safe).
      - name: Mechanical result (regression gate, skipped when unaffected)
        id: mech
        run: |
          set +e
          if grep -qE '^(src/|tests/|scripts/|pyproject\.toml$)' changed_files.txt; then
            python scripts/regression_gate.py \
              --base-ref "origin/${{ github.base_ref }}" \
              --report-path regression_report.json
            echo "rc=$?" >> "$GITHUB_OUTPUT"
          else
            echo "regression gate skipped: no measured path touched (equivalent to pass)"
            echo "rc=0" >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Compose change context
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          MECH_FLAG=--no-mech-pass
          [ "${{ steps.mech.outputs.rc }}" = "0" ] && MECH_FLAG=--mech-pass
          python scripts/merge_gate_context.py "$MECH_FLAG" --output context.json
          cat context.json
      - name: Shadow decision (log-only; decisions 0/10/20 all succeed)
        id: decide
        run: |
          set +e
          python -m agent_core.merge_gate_ci --store "$STORE" \
            --context context.json --audit-log merge_decisions.jsonl \
            | tee decision_agent.txt
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          case "$rc" in
            0 | 10 | 20) exit 0 ;;
            *) exit 1 ;;
          esac
      # Second, log-only decision against human/<domain> — the namespace where
      # audited records actually accumulate (ADR 0018 §5). Agent domains stay
      # in cold-start ESCALATE until an agent-confidence artifact exists, so
      # this is what exercises the calibrator/tau/health path during the soak.
      - name: Observability decision (human/<domain>, log-only)
        if: always()
        run: |
          set +e
          jq '.domain = "human/" + .domain' context.json > context_human.json
          python -m agent_core.merge_gate_ci --store "$STORE" \
            --context context_human.json | tee decision_human.txt
          exit 0
      - name: Step summary
        if: always()
        run: |
          {
            echo "## Shadow merge-gate decision"
            echo '```'
            echo "agent domain : $(grep -m1 '^DECISION=' decision_agent.txt || echo 'unavailable')"
            echo "human domain : $(grep -m1 '^DECISION=' decision_human.txt || echo 'unavailable')"
            echo "mech rc      : ${{ steps.mech.outputs.rc }}"
            echo '```'
            echo "### Store record counts (per domain, per label source)"
            echo '```json'
            python -m agent_core.store_sync stats --store "$STORE" --soak-progress || echo '{}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
