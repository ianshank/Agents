# Runs the staged claude-foundation suite from the repository root.
# The staging tree ships its own workflow (claude-foundation/.github/workflows/ci.yml),
# but GitHub only runs workflows from the repository root, so that copy is inert until
# extraction (ADR 0017). Without this job the foundation's tests and 85% coverage gate
# are enforced by no active CI. Delete this file in the same PR that removes the
# claude-foundation/ staging directory post-extraction.
#
# Scope: the deterministic Python gates only (lint, format, types, validators, tests).
# The npm/claude-code install smoke and the behavioral release gate stay in the staging
# workflow — they belong to the extracted repository's release process, not to merges here.
name: claude-foundation CI (staging)

on:
  # Keep both filters in flow style: `scripts/validations/F_037.py` asserts the literal
  # substring `paths: ["claude-foundation/**"` is present, so reflowing these into block
  # lists fails that validator. `required-check-stubs.yml` reads this list too and parses
  # either style.
  push:
    branches: [main]
    paths: ["claude-foundation/**", ".github/workflows/claude-foundation-ci.yml", "uv.lock"]
  pull_request:
    paths: ["claude-foundation/**", ".github/workflows/claude-foundation-ci.yml", "uv.lock"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claude-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Namespaced -- see ADR 0040. The bare `py<version>` name collided with
    # eval-harness-ci.yml and agent-core-ci.yml on the same check contexts.
    name: claude-foundation py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false
      # Delegate to the generated package gate so CI runs the exact same steps as
      # local `make -C claude-foundation check` (ADR 0021). The gate's lint scope is
      # `.` (a superset of the old inline `tools tests hooks`) and its do_extra runs
      # foundation_tools validate + scan.
      - uses: ./.github/actions/run-quality-gate
        with:
          python-version: ${{ matrix.python-version }}
          working-directory: claude-foundation
          install: uv sync --locked --package claude-foundation-tools --extra dev
          check: make check
