name: opik-live (opt-in)

# Manually triggered: needs network egress to PyPI and an OPIK_API_KEY secret, so it
# is deliberately NOT part of the offline PR gate. It validates the Opik tracing
# integration against the live Opik Cloud APIs.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opik-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    name: opik integration smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPIK_WORKSPACE: ian-cruickshank
      OPIK_API_KEY: ${{ secrets.OPIK_API_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip "setuptools>=68"
      - run: pip install -e ".[dev,opik]"
      # Run the integration marked tests for opik
      - name: Live Opik integration tests
        run: python -m pytest tests/test_opik_live.py -v -rs -m integration
